<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Tipos de Plano - RMStudio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header" th:replace="~{index :: header}"></header>

    <main class="main-content form-page-container">
        <div class="container">
            <h1 class="page-title"><i class="fas fa-tags"></i> Gestão de Tipos de Plano</h1>

            <div class="card form-card">
                <h3 class="card-title">Adicionar / Editar Tipo de Plano</h3>
                <form id="form-tipo-plano">
                    <input type="hidden" id="id" name="id">
                    <div class="form-grid-double">
                        <div class="form-group">
                            <label for="nome" class="form-label">Nome do Plano</label>
                            <input type="text" id="nome" name="nome" class="form-control" required placeholder="Ex: Plano Mensal">
                        </div>
                        <div class="form-group">
                            <label for="valor" class="form-label">Valor (R$)</label>
                            <input type="number" id="valor" name="valor" step="0.01" class="form-control" required placeholder="Ex: 99.90">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea id="descricao" name="descricao" class="form-control" rows="3" placeholder="Detalhes do plano..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-plus"></i> Novo</button>
                    </div>
                </form>
            </div>

            <div class="card" style="margin-top: 32px;">
                <h3 class="card-title">Tipos de Plano Cadastrados</h3>
                <div class="table-responsive">
                    <table class="table" id="tabela-tipos-plano">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Valor (R$)</th>
                                <th>Descrição</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="pagination-controls" id="pagination-controls"></div>
            </div>
        </div>
    </main>

    <footer class="footer" th:replace="~{index :: footer}"></footer>

    <script>
        const API_URL = '/api/tipos-plano';
        let form, tableBody, paginationControls;
        
        // Funções globais para serem acessíveis via onclick
        async function fetchData(page = 0, size = 10) {
            try {
                const response = await fetch(`${API_URL}?page=${page}&size=${size}&sort=nome,asc`);
                const pageData = await response.json();
                renderTable(pageData.content);
                renderPagination(pageData);
            } catch (error) {
                console.error('Falha ao buscar dados:', error);
                tableBody.innerHTML = `<tr><td colspan="4">Erro ao carregar dados.</td></tr>`;
            }
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
             if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Nenhum tipo de plano cadastrado.</td></tr>`;
                return;
            }
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.nome}</td>
                    <td>${item.valor.toFixed(2)}</td>
                    <td>${item.descricao || ''}</td>
                    <td class="cell-actions">
                        <button class="btn btn-secondary" onclick="editItem('${item.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-secondary" onclick="deleteItem('${item.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function renderPagination(pageData) {
            paginationControls.innerHTML = '';
            if (pageData.totalPages <= 1) return;
            let html = '';
            if (!pageData.first) {
                html += `<button class="btn btn-secondary" onclick="fetchData(${pageData.number - 1})">Anterior</button>`;
            }
            for (let i = 0; i < pageData.totalPages; i++) {
                html += `<button class="btn ${i === pageData.number ? 'btn-primary active' : 'btn-secondary'}" onclick="fetchData(${i})">${i + 1}</button>`;
            }
            if (!pageData.last) {
                html += `<button class="btn btn-secondary" onclick="fetchData(${pageData.number + 1})">Próximo</button>`;
            }
            paginationControls.innerHTML = html;
        }

        async function editItem(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const item = await response.json();
                document.getElementById('id').value = item.id;
                document.getElementById('nome').value = item.nome;
                document.getElementById('descricao').value = item.descricao;
                document.getElementById('valor').value = item.valor;
                window.scrollTo(0, 0);
            } catch (error) {
                console.error('Falha ao carregar para edição:', error);
            }
        }

        async function deleteItem(id) {
            if (!confirm('Tem certeza que deseja excluir este tipo de plano?')) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Erro ao excluir');
                fetchData();
            } catch (error) {
                console.error('Falha ao excluir:', error);
            }
        }

        function resetForm() {
            form.reset();
            document.getElementById('id').value = '';
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            form = document.getElementById('form-tipo-plano');
            tableBody = document.querySelector('#tabela-tipos-plano tbody');
            paginationControls = document.getElementById('pagination-controls');

            // Mobile nav toggle
            const navToggle = document.querySelector('.nav-toggle');
            const navLinks = document.querySelector('.nav-links');
            if (navToggle) {
                navToggle.addEventListener('click', () => {
                    navLinks.classList.toggle('open');
                });
            }
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                const id = data.id;

                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API_URL}/${id}` : API_URL;

                try {
                    const response = await fetch(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data),
                    });
                    if (!response.ok) throw new Error('Erro ao salvar');
                    resetForm();
                    fetchData();
                } catch (error) {
                    console.error('Falha ao salvar:', error);
                }
            });
            
            // Carregar dados ao inicializar
            fetchData();
        });
    </script>
</body>
</html>
