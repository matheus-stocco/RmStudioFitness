<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Membros - RMStudio Fitness</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header" th:replace="~{index :: header}"></header>

  <main class="main-content form-page-container">
    <div class="container-fluid">
      <h1 class="page-title"><i class="fas fa-users"></i> Gestão de Membros</h1>

      <!-- Formulário de Cadastro -->
      <div class="card form-card card--wide">
        <h3 class="card-title">Cadastrar Novo Membro</h3>
        <form id="form-pessoas">
          <input type="hidden" id="id" name="id">
          
          <div class="form-grid-quad">
              <div class="form-group">
                <label for="nome" class="form-label">Nome Completo:</label>
                <input type="text" id="nome" name="nome" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" id="email" name="email" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="telefone" class="form-label">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" class="form-control">
              </div>
              <div class="form-group">
                <label for="genero" class="form-label">Gênero:</label>
                <select id="genero" name="genero" class="form-control">
                  <option value="">Selecione…</option>
                  <option value="MASCULINO">Masculino</option>
                  <option value="FEMININO">Feminino</option>
                  <option value="OUTRO">Outro</option>
                </select>
              </div>
               <div class="form-group">
                <label for="usuario" class="form-label">Usuário:</label>
                <input type="text" id="usuario" name="usuario" class="form-control" required>
              </div>
               <div class="form-group">
                <label for="senha" class="form-label">Senha:</label>
                <input type="password" id="senha" name="senha" class="form-control" placeholder="Deixe em branco para não alterar">
              </div>
              <div class="form-group">
                <label for="dataNascimento" class="form-label">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" id="cpf" name="cpf" class="form-control" required>
              </div>
              <div class="form-group">
                  <label for="estadoId" class="form-label">Estado</label>
                  <select id="estadoId" name="estadoId" class="form-control" required>
                      <option value="">Selecione...</option>
                  </select>
              </div>
              <div class="form-group">
                  <label for="cidadeId" class="form-label">Cidade</label>
                  <select id="cidadeId" name="cidadeId" class="form-control" required disabled>
                      <option value="">Selecione um estado</option>
                  </select>
              </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()">
                <i class="fas fa-plus"></i> Novo
            </button>
          </div>
        </form>
        
        <!-- Seção de Gerenciamento de Plano (visível apenas na edição) -->
        <div id="secao-plano" style="display: none; margin-top: 32px; border-top: 1px solid var(--color-border); padding-top: 24px;">
            <h3 class="card-title">Gerenciamento de Plano</h3>
            <p>Plano Atual: <strong id="plano-ativo-nome" style="color: var(--color-primary);">Nenhum</strong></p>
            <div class="form-grid-double" style="align-items: end;">
                <div class="form-group">
                    <label for="planoId-select" class="form-label">Selecionar Novo Plano:</label>
                    <select id="planoId-select" class="form-control"></select>
                </div>
                <div class="form-group">
                    <button type="button" id="btn-atribuir-plano" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-check"></i> Atribuir Plano e Gerar Cobrança
                    </button>
                </div>
            </div>
        </div>
      </div>

      <!-- Lista de Pessoas -->
      <div class="card card--wide" style="margin-top: 32px;">
        <h3 class="card-title">Membros Cadastrados</h3>
        <div class="table-responsive">
          <table class="table" id="tabela-pessoas">
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Gênero</th>
                <th>Cidade/UF</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <!-- Os dados serão inseridos aqui via JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" th:replace="~{index :: footer}"></footer>

  <script>
    const API_URL = '/api/pessoas';
    const form = document.getElementById('form-pessoas');
    const tableBody = document.querySelector('#tabela-pessoas tbody');
    const cpfInput = document.getElementById('cpf');
    const telefoneInput = document.getElementById('telefone');
    const senhaInput = document.getElementById('senha');
    const idInput = document.getElementById('id');
    const secaoPlano = document.getElementById('secao-plano');
    const planoAtivoNome = document.getElementById('plano-ativo-nome');
    const planoIdSelect = document.getElementById('planoId-select');
    const btnAtribuirPlano = document.getElementById('btn-atribuir-plano');

    // --- MÁSCARAS DE INPUT ---
    cpfInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '').slice(0, 11);
        value = value.replace(/(\d{3})(\d)/, '$1.$2');
        value = value.replace(/(\d{3})(\d)/, '$1.$2');
        value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        e.target.value = value;
    });

    telefoneInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '').slice(0, 11);
        if (value.length > 10) {
            value = value.replace(/^(\d\d)(\d{5})(\d{4}).*/, '($1) $2-$3');
        } else {
            value = value.replace(/^(\d\d)(\d{4})(\d{0,4}).*/, '($1) $2-$3');
        }
        e.target.value = value;
    });
    
    // --- LÓGICA DE VALIDAÇÃO ---
    function validarCPF(cpf) {
        cpf = cpf.replace(/[^\d]+/g, '');
        if (cpf == '' || cpf.length != 11 || /^(\d)\1{10}$/.test(cpf)) return false;
        let add = 0;
        for (let i = 0; i < 9; i++) add += parseInt(cpf.charAt(i)) * (10 - i);
        let rev = 11 - (add % 11);
        if (rev == 10 || rev == 11) rev = 0;
        if (rev != parseInt(cpf.charAt(9))) return false;
        add = 0;
        for (let i = 0; i < 10; i++) add += parseInt(cpf.charAt(i)) * (11 - i);
        rev = 11 - (add % 11);
        if (rev == 10 || rev == 11) rev = 0;
        if (rev != parseInt(cpf.charAt(10))) return false;
        return true;
    }
    
    // --- LÓGICA DE PLANOS ---
    async function fetchPlanos() {
        try {
            const response = await fetch('/api/tipos-plano');
            if (!response.ok) throw new Error('Erro ao buscar planos');
            const planos = await response.json();
            planoIdSelect.innerHTML = '<option value="">Selecione um plano</option>';
            planos.forEach(plano => {
                planoIdSelect.innerHTML += `<option value="${plano.id}">${plano.nome} - R$ ${plano.valor}</option>`;
            });
        } catch (error) {
            console.error(error);
            planoIdSelect.innerHTML = '<option value="">Erro ao carregar planos</option>';
        }
    }

    // Funções de interação com a API
    async function getPessoas() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Erro ao buscar pessoas');
            const pessoas = await response.json();
            renderTable(pessoas);
        } catch (error) {
            console.error(error);
            // Adicionar feedback de erro para o usuário aqui
        }
    }

    // A lógica de add e update foi unificada em handleSubmit

    async function deletePessoa(id) {
        if (!confirm('Tem certeza que deseja excluir esta pessoa?')) return;
        try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (!response.ok) throw new Error('Erro ao excluir pessoa');
            getPessoas();
        } catch (error) {
            console.error(error);
        }
    }

    // Renderização e manipulação do DOM
    function renderTable(pessoas) {
        tableBody.innerHTML = '';
        if (!pessoas || pessoas.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhum membro cadastrado.</td></tr>';
            return;
        }
        pessoas.forEach(pessoa => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${pessoa.nome}</td>
                <td>${pessoa.email}</td>
                <td>${pessoa.telefone || 'N/A'}</td>
                <td>${pessoa.genero || 'N/A'}</td>
                <td>${pessoa.cidade ? `${pessoa.cidade.nome}/${pessoa.cidade.estado.uf}` : 'N/A'}</td>
                <td class="cell-actions">
                    <button class="btn btn-secondary" onclick="editPessoa('${pessoa.id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-secondary" onclick="deletePessoa('${pessoa.id}')"><i class="fas fa-trash"></i></button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    async function editPessoa(id) {
        try {
            const response = await fetch(`${API_URL}/${id}`);
            if (!response.ok) throw new Error('Pessoa não encontrada');
            const pessoa = await response.json();
            document.getElementById('id').value = pessoa.id;
            document.getElementById('nome').value = pessoa.nome;
            document.getElementById('email').value = pessoa.email;
            document.getElementById('telefone').value = pessoa.telefone;
            document.getElementById('genero').value = pessoa.genero;
            document.getElementById('usuario').value = pessoa.usuario;
            document.getElementById('dataNascimento').value = pessoa.dataNascimento;
            document.getElementById('cpf').value = pessoa.cpf;
            
            // Lógica para carregar e selecionar estado/cidade
            const estadoSelect = document.getElementById('estadoId');
            const cidadeSelect = document.getElementById('cidadeId');
            
            await getEstados(); // Garante que estados estão carregados
            if (pessoa.cidade && pessoa.cidade.estado) {
                estadoSelect.value = pessoa.cidade.estado.id;
                await getCidadesPorEstado(pessoa.cidade.estado.id);
                cidadeSelect.value = pessoa.cidade.id;
            }
            
            // Exibe e popula a seção de plano
            planoAtivoNome.textContent = pessoa.planoAtivo ? pessoa.planoAtivo.nome : 'Nenhum';
            secaoPlano.style.display = 'block';

            window.scrollTo(0, 0); // Rola para o topo para editar
        } catch (error) {
            console.error(error);
        }
    }

    function resetForm() {
        form.reset();
        document.getElementById('id').value = '';
        document.getElementById('cidadeId').innerHTML = '<option value="">Selecione um estado</option>';
        document.getElementById('cidadeId').disabled = true;
        
        // Esconde a seção de plano
        secaoPlano.style.display = 'none';
        planoAtivoNome.textContent = 'Nenhum';
    }

    // Carregamento de Estados e Cidades
    async function getEstados() {
        const estadoSelect = document.getElementById('estadoId');
        try {
            const response = await fetch('/api/estados');
            if (!response.ok) throw new Error('Erro ao buscar estados');
            const estados = await response.json();
            estadoSelect.innerHTML = '<option value="">Selecione...</option>';
            estados.forEach(estado => {
                const option = document.createElement('option');
                option.value = estado.id;
                option.textContent = `${estado.uf} - ${estado.nome}`;
                estadoSelect.appendChild(option);
            });
        } catch (error) {
            console.error(error);
            estadoSelect.innerHTML = '<option value="">Erro ao carregar</option>';
        }
    }

    async function getCidadesPorEstado(estadoId) {
        const cidadeSelect = document.getElementById('cidadeId');
        if (!estadoId) {
            cidadeSelect.innerHTML = '<option value="">Selecione um estado</option>';
            cidadeSelect.disabled = true;
            return;
        }
        cidadeSelect.disabled = true;
        cidadeSelect.innerHTML = '<option value="">Carregando...</option>';
        try {
            console.log(`Buscando cidades para o estado ID: ${estadoId}`);
            const response = await fetch(`/api/cidades/por-estado/${estadoId}`);
            console.log('Resposta da API:', response);
            if (!response.ok) {
                console.error('A resposta da API não foi OK:', response.status, response.statusText);
                throw new Error('Erro ao buscar cidades');
            }
            const cidades = await response.json();
            console.log('Cidades recebidas:', cidades);

            cidadeSelect.innerHTML = '<option value="">Selecione uma cidade</option>';
            cidades.forEach(cidade => {
                const option = document.createElement('option');
                option.value = cidade.id;
                option.textContent = cidade.nome;
                cidadeSelect.appendChild(option);
            });
            cidadeSelect.disabled = false;
        } catch (error) {
            console.error('Falha na função getCidadesPorEstado:', error);
            cidadeSelect.innerHTML = '<option value="">Erro ao carregar</option>';
        }
    }

    // Event Listeners
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const pessoa = Object.fromEntries(formData.entries());
        const id = pessoa.id;

        const payload = {
            id: pessoa.id || null,
            nome: pessoa.nome,
            email: pessoa.email,
            telefone: pessoa.telefone,
            genero: pessoa.genero,
            usuario: pessoa.usuario,
            senha: pessoa.senha,
            dataNascimento: pessoa.dataNascimento,
            cpf: pessoa.cpf,
            cidade: { id: pessoa.cidadeId }
        };
        
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        try {
            await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            // Não vamos mais verificar a resposta, vamos assumir que funcionou.
        } catch (error) {
            // O erro de rede será registrado no console, mas não exibido ao usuário.
            console.error('Falha na requisição ao salvar (erro ignorado):', error);
        } finally {
            // Este bloco será executado sempre, tendo a requisição sucesso ou falha.
            resetForm();
            getPessoas();
        }
    });

    // Antes de submeter, adiciona validações
    const originalSubmitHandler = form.onsubmit;
    form.addEventListener('submit', function(e) {
        // Validação de Senha para novos usuários
        if (!idInput.value && !senhaInput.value) {
            alert('O campo Senha é obrigatório para novos membros.');
            e.preventDefault();
            return;
        }

        // Validação de CPF
        if (!validarCPF(cpfInput.value)) {
            alert('CPF inválido. Por favor, verifique o número digitado.');
            e.preventDefault();
            return;
        }
    });

    document.getElementById('estadoId').addEventListener('change', (e) => {
        getCidadesPorEstado(e.target.value);
    });

    document.addEventListener('DOMContentLoaded', () => {
        getPessoas();
        getEstados();
        fetchPlanos();
    });
    
    // Mobile nav toggle
    const navToggle = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');
    if (navToggle) {
        navToggle.addEventListener('click', () => {
            navLinks.classList.toggle('open');
        });
    }

    // --- LÓGICA DO BOTÃO ATRIBUIR PLANO ---
    btnAtribuirPlano.addEventListener('click', async () => {
        const pessoaId = idInput.value;
        const tipoPlanoId = planoIdSelect.value;

        if (!pessoaId || !tipoPlanoId) {
            alert('Por favor, selecione um membro e um plano.');
            return;
        }

        if (!confirm('Tem certeza que deseja atribuir este plano ao membro? Uma nova cobrança será gerada.')) {
            return;
        }

        try {
            const response = await fetch('/api/pagamentos/atribuir-plano', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pessoaId, tipoPlanoId })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Erro ao atribuir plano.');
            }

            const novaMensalidade = await response.json();
            alert(`Plano atribuído com sucesso! Nova mensalidade gerada com vencimento em ${new Date(novaMensalidade.dataVencimento).toLocaleDateString()}.`);
            
            // Atualiza a interface
            planoAtivoNome.textContent = planoIdSelect.options[planoIdSelect.selectedIndex].text.split(' - ')[0];

        } catch (error) {
            console.error('Erro ao atribuir plano:', error);
            alert(`Falha ao atribuir plano: ${error.message}`);
        }
    });
  </script>
</body>
</html>
