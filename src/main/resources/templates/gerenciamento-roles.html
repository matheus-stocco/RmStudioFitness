<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Papéis - RM Studio Fitness</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header th:replace="~{index :: header}"></header>

    <main class="container mt-5 gerenciamento-container">
        <h1 class="mb-4 page-title">Gerenciamento de Papéis de Usuário</h1>

        <div class="card">
            <div class="card-body">
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="buscaUsuario" class="form-label">Buscar por Nome</label>
                        <input type="text" id="buscaUsuario" class="form-control" placeholder="Digite o nome do usuário...">
                    </div>
                    <div class="col-md-4">
                        <label for="filtroRole" class="form-label">Filtrar por Papel</label>
                        <select id="filtroRole" class="form-select">
                            <option value="">Todos</option>
                            <option value="ROLE_USER">Apenas USER</option>
                            <option value="ROLE_PERSONAL">Apenas PERSONAL</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Papéis</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaUsuarios">
                            <!-- Usuários serão inseridos aqui via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{index :: footer}"></footer>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
