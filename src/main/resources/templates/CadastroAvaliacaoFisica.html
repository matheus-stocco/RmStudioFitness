<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Avaliações Físicas - RMStudio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header" th:replace="~{index :: header}"></header>

    <main class="main-content form-page-container">
        <div class="container-fluid">
            <h1 class="page-title"><i class="fas fa-chart-line"></i> Gestão de Avaliações Físicas</h1>

            <div class="card form-card card--wide">
                <h3 class="card-title">Nova Avaliação Física</h3>
                <form id="form-avaliacao">
                    <input type="hidden" id="id" name="id">
                    
                    <!-- Grid principal com 4 colunas -->
                    <div class="form-grid-quad">
                        <!-- Coluna 1: Aluno e Medidas Principais -->
                        <div class="form-group">
                            <label for="pessoaId" class="form-label">Aluno</label>
                            <select id="pessoaId" name="pessoaId" class="form-control" required></select>
                        </div>
                        <div class="form-group">
                            <label for="dataAvaliacao" class="form-label">Data da Avaliação</label>
                            <input type="date" id="dataAvaliacao" name="dataAvaliacao" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="peso" class="form-label">Peso (kg)</label>
                            <input type="number" id="peso" name="peso" step="0.1" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="altura" class="form-label">Altura (m)</label>
                            <input type="number" id="altura" name="altura" step="0.01" class="form-control" required>
                        </div>

                        <!-- Coluna 2: Composição Corporal -->
                        <div class="form-group">
                            <label for="gorduraCorporal" class="form-label">Gordura Corp. (%)</label>
                            <input type="number" id="gorduraCorporal" name="gorduraCorporal" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="massaMagra" class="form-label">Massa Magra (kg)</label>
                            <input type="number" id="massaMagra" name="massaMagra" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="massaMuscular" class="form-label">Massa Muscular (kg)</label>
                            <input type="number" id="massaMuscular" name="massaMuscular" class="form-control" step="0.1">
                        </div>
                         <div class="form-group">
                            <label for="hidratacao" class="form-label">Hidratação (%)</label>
                            <input type="number" id="hidratacao" name="hidratacao" class="form-control" step="0.1">
                        </div>

                        <!-- Coluna 3: Métricas de Saúde -->
                        <div class="form-group">
                            <label for="taxaMetabolismoBasal" class="form-label">Metab. Basal (kcal)</label>
                            <input type="number" id="taxaMetabolismoBasal" name="taxaMetabolismoBasal" class="form-control" step="1">
                        </div>
                        <div class="form-group">
                            <label for="densidadeOssea" class="form-label">Dens. Óssea (%)</label>
                            <input type="number" id="densidadeOssea" name="densidadeOssea" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="gorduraVisceral" class="form-label">Gord. Visceral (%)</label>
                            <input type="number" id="gorduraVisceral" name="gorduraVisceral" class="form-control" step="0.1">
                        </div>
                         <div class="form-group">
                            <label for="medidaPescoco" class="form-label">Pescoço (cm)</label>
                            <input type="number" id="medidaPescoco" name="medidaPescoco" class="form-control" step="0.1">
                        </div>
                        
                        <!-- Coluna 4: Medidas Corporais -->
                        <div class="form-group">
                            <label for="medidaCintura" class="form-label">Cintura (cm)</label>
                            <input type="number" id="medidaCintura" name="medidaCintura" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="medidaQuadril" class="form-label">Quadril (cm)</label>
                            <input type="number" id="medidaQuadril" name="medidaQuadril" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="medidaBracoDireito" class="form-label">Braço D. (cm)</label>
                            <input type="number" id="medidaBracoDireito" name="medidaBracoDireito" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="medidaBracoEsquerdo" class="form-label">Braço E. (cm)</label>
                            <input type="number" id="medidaBracoEsquerdo" name="medidaBracoEsquerdo" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="medidaPernaDireita" class="form-label">Perna D. (cm)</label>
                            <input type="number" id="medidaPernaDireita" name="medidaPernaDireita" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="medidaPernaEsquerda" class="form-label">Perna E. (cm)</label>
                            <input type="number" id="medidaPernaEsquerda" name="medidaPernaEsquerda" class="form-control" step="0.1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="observacoes" class="form-label">Observações</label>
                        <textarea id="observacoes" name="observacoes" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-plus"></i> Nova</button>
                    </div>
                </form>
            </div>

            <div class="card card--wide" style="margin-top: 32px;">
                <h3 class="card-title">Avaliações Recentes</h3>
                <div class="table-responsive">
                    <table class="table" id="tabela-avaliacoes">
                        <thead>
                            <tr>
                                <th>Aluno</th>
                                <th>Data</th>
                                <th>Gênero</th>
                                <th>IMC</th>
                                <th>Peso</th>
                                <th>Altura</th>
                                <th>Gordura Corporal</th>
                                <th>Massa Magra</th>
                                <th>Massa Muscular</th>
                                <th>Hidratação</th>
                                <th>Metabolismo Basal</th>
                                <th>Densidade Óssea</th>
                                <th>Gordura Visceral</th>
                                <th>Pescoço</th>
                                <th>Cintura</th>
                                <th>Quadril</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" th:replace="~{index :: footer}"></footer>

    <script>
        const API_URL = '/api/avaliacoes';
        const API_PESSOAS_URL = '/api/pessoas';
        const form = document.getElementById('form-avaliacao');
        const tableBody = document.querySelector('#tabela-avaliacoes tbody');

        async function fetchPessoas() {
            const pessoaSelect = document.getElementById('pessoaId');
            try {
                const response = await fetch(API_PESSOAS_URL);
                const pessoas = await response.json();
                pessoaSelect.innerHTML = '<option value="">Selecione um aluno</option>';
                pessoas.forEach(pessoa => {
                    pessoaSelect.innerHTML += `<option value="${pessoa.id}">${pessoa.nome}</option>`;
                });
            } catch (error) {
                console.error('Erro ao buscar pessoas:', error);
                pessoaSelect.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        async function fetchAvaliacoes() {
            try {
                console.log('Buscando avaliações da API:', API_URL);
                const response = await fetch(API_URL);
                console.log('Response status:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const avaliacoes = await response.json();
                console.log('Avaliações recebidas:', avaliacoes);
                renderTable(avaliacoes);
            } catch (error) {
                console.error('Erro ao buscar avaliações:', error);
                tableBody.innerHTML = `<tr><td colspan="14">Erro ao carregar avaliações: ${error.message}</td></tr>`;
            }
        }

        // --- Funções de Formatação ---
        function formatValue(value, { unit = '', decimals = -1, fallback = 'N/A' } = {}) {
            if (value === null || value === undefined || value === '') return fallback;
            const number = parseFloat(value);
            if (isNaN(number)) return fallback;

            let formattedNumber;
            if (decimals >= 0) {
                formattedNumber = number.toFixed(decimals);
            } else {
                formattedNumber = number.toString();
            }

            return `${formattedNumber} ${unit}`.trim();
        }

        function renderTable(avaliacoes) {
            console.log('Renderizando tabela com', avaliacoes.length, 'avaliações');
            tableBody.innerHTML = '';
             if (avaliacoes.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="14" style="text-align:center;">Nenhuma avaliação cadastrada.</td></tr>`;
                return;
            }
            avaliacoes.forEach((av, index) => {
                console.log(`Avaliação ${index}:`, av);
                console.log(`Pessoa da avaliação ${index}:`, av.pessoa);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${av.pessoa ? av.pessoa.nome : 'N/A'}</td>
                    <td>${new Date(av.dataAvaliacao).toLocaleDateString()}</td>
                    <td>${av.pessoa ? av.pessoa.generoDescricao : 'N/A'}</td>
                    <td>${av.calcularIMC ? `${formatValue(av.calcularIMC, { decimals: 1 })} (${av.classificarIMC})` : 'N/A'}</td>
                    <td>${formatValue(av.peso, { unit: 'kg', decimals: 1 })}</td>
                    <td>${formatValue(av.altura, { unit: 'm', decimals: 2 })}</td>
                    <td>${formatValue(av.gorduraCorporal, { unit: '%', decimals: 1 })}</td>
                    <td>${formatValue(av.massaMagra, { unit: 'kg', decimals: 1 })}</td>
                    <td>${formatValue(av.massaMuscular, { unit: 'kg', decimals: 1 })}</td>
                    <td>${formatValue(av.hidratacao, { unit: '%', decimals: 1 })}</td>
                    <td>${formatValue(av.taxaMetabolismoBasal, { unit: 'kcal/dia', decimals: 0 })}</td>
                    <td>${formatValue(av.densidadeOssea, { unit: '%', decimals: 1 })}</td>
                    <td>${formatValue(av.gorduraVisceral, { unit: '%', decimals: 1 })}</td>
                    <td>${formatValue(av.medidaPescoco, { unit: 'cm', decimals: 1 })}</td>
                    <td>${formatValue(av.medidaCintura, { unit: 'cm', decimals: 1 })}</td>
                    <td>${formatValue(av.medidaQuadril, { unit: 'cm', decimals: 1 })}</td>
                    <td class="cell-actions">
                        <button class="btn btn-secondary" onclick="editAvaliacao('${av.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-secondary" onclick="deleteAvaliacao('${av.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const id = formData.get('id');
            const payload = {
                pessoaId: formData.get('pessoaId'),
                dataAvaliacao: formData.get('dataAvaliacao'),
                peso: formData.get('peso'),
                altura: formData.get('altura'),
                gorduraCorporal: formData.get('gorduraCorporal'),
                massaMagra: formData.get('massaMagra'),
                massaMuscular: formData.get('massaMuscular'),
                hidratacao: formData.get('hidratacao'),
                taxaMetabolismoBasal: formData.get('taxaMetabolismoBasal'),
                densidadeOssea: formData.get('densidadeOssea'),
                gorduraVisceral: formData.get('gorduraVisceral'),
                medidaPescoco: formData.get('medidaPescoco'),
                medidaCintura: formData.get('medidaCintura'),
                medidaQuadril: formData.get('medidaQuadril'),
                medidaBracoDireito: formData.get('medidaBracoDireito'),
                medidaBracoEsquerdo: formData.get('medidaBracoEsquerdo'),
                medidaPernaDireita: formData.get('medidaPernaDireita'),
                medidaPernaEsquerda: formData.get('medidaPernaEsquerda'),
                observacoes: formData.get('observacoes')
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) throw new Error('Erro ao salvar avaliação');
                resetForm();
                fetchAvaliacoes();
            } catch (error) {
                console.error('Erro:', error);
            }
        });

        async function editAvaliacao(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const av = await response.json();
                document.getElementById('id').value = av.id;
                document.getElementById('pessoaId').value = av.pessoa.id;
                document.getElementById('dataAvaliacao').value = av.dataAvaliacao.split('T')[0];
                document.getElementById('peso').value = av.peso;
                document.getElementById('altura').value = av.altura;
                document.getElementById('gorduraCorporal').value = av.gorduraCorporal;
                document.getElementById('massaMagra').value = av.massaMagra;
                document.getElementById('massaMuscular').value = av.massaMuscular;
                document.getElementById('hidratacao').value = av.hidratacao;
                document.getElementById('taxaMetabolismoBasal').value = av.taxaMetabolismoBasal;
                document.getElementById('densidadeOssea').value = av.densidadeOssea;
                document.getElementById('gorduraVisceral').value = av.gorduraVisceral;
                document.getElementById('medidaPescoco').value = av.medidaPescoco;
                document.getElementById('medidaCintura').value = av.medidaCintura;
                document.getElementById('medidaQuadril').value = av.medidaQuadril;
                document.getElementById('medidaBracoDireito').value = av.medidaBracoDireito;
                document.getElementById('medidaBracoEsquerdo').value = av.medidaBracoEsquerdo;
                document.getElementById('medidaPernaDireita').value = av.medidaPernaDireita;
                document.getElementById('medidaPernaEsquerda').value = av.medidaPernaEsquerda;
                document.getElementById('observacoes').value = av.observacoes;
                window.scrollTo(0, 0);
            } catch (error) {
                console.error('Erro ao carregar avaliação para edição:', error);
            }
        }

        async function deleteAvaliacao(id) {
            if (!confirm('Tem certeza que deseja excluir esta avaliação?')) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Erro ao excluir');
                fetchAvaliacoes();
            } catch (error) {
                console.error('Erro ao excluir:', error);
            }
        }

        function resetForm() {
            form.reset();
            document.getElementById('id').value = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPessoas();
            fetchAvaliacoes();
            document.getElementById('dataAvaliacao').valueAsDate = new Date();
        });

        // Mobile nav toggle
        const navToggle = document.querySelector('.nav-toggle');
        const navLinks = document.querySelector('.nav-links');
        if (navToggle) {
            navToggle.addEventListener('click', () => {
                navLinks.classList.toggle('open');
            });
        }
    </script>
</body>
</html>
