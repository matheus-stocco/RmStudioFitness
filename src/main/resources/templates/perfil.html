<!--
  Página de Perfil do Usuário.
  Esta página exibe as informações do usuário que está logado.
  Ela reutiliza os fragmentos de cabeçalho e rodapé do index.html.
-->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - RMStudio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="plan-body">
    <!-- Inclui o cabeçalho reutilizável -->
    <header class="header" th:replace="~{index :: header}"></header>

    <main class="main-content form-page-container">
        <div class="container">
            <h1 class="page-title"><i class="fas fa-user-circle"></i> Meu Perfil</h1>

            <!-- 
                Container principal das informações.
                - th:if="${pessoa != null}": Garante que o conteúdo só será renderizado se o objeto "pessoa"
                  tiver sido enviado pelo controlador.
            -->
            <div th:if="${pessoa != null}">
                <div class="profile-info">
                    <!-- 
                      Exibição dos dados da pessoa.
                      - th:text="${pessoa.nome}": O Thymeleaf irá substituir o conteúdo desta tag pelo valor do atributo "nome"
                        do objeto "pessoa" que veio do back-end.
                      - O operador ternário (?:) é usado para fornecer um valor padrão caso o campo seja nulo ou vazio.
                        Ex: th:text="${pessoa.telefone ?: 'Não informado'}"
                    -->
                    <div class="info-item">
                        <span class="info-label">Nome Completo:</span>
                        <span class="info-value" th:text="${pessoa.nome}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Usuário:</span>
                        <span class="info-value" th-text="${pessoa.username}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">E-mail:</span>
                        <span class="info-value" th:text="${pessoa.email}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Telefone:</span>
                        <span class="info-value" th:text="${pessoa.telefone ?: 'Não informado'}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Gênero:</span>
                        <span class="info-value" th:text="${pessoa.generoDescricao}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Data de Nascimento:</span>
                        <span class="info-value" th:text="${pessoa.dataNascimentoFormatada ?: 'Não informada'}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">CPF:</span>
                        <span class="info-value" th:text="${pessoa.cpfFormatado ?: 'Não informado'}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Localização:</span>
                        <span class="info-value" th:text="${pessoa.localizacaoCompleta}"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Inclui o rodapé reutilizável -->
    <footer class="footer" th:replace="~{index :: footer}"></footer>
</body>
</html>
