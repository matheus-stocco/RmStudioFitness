<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Planos de Aula - RMStudio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Reutiliza o cabeçalho do index.html -->
<header th:replace="~{index :: header}"></header>

<main class="form-page-container">
    <div class="container">
        <h1 class="page-title">
            <i class="fas fa-clipboard-list"></i>
            Meus Planos de Aula
        </h1>

        <div class="planos-aula-list">
            
            <!-- Mensagem se não houver planos -->
            <div th:if="${#lists.isEmpty(planosDeAula)}" class="card empty-state">
                <i class="fas fa-folder-open"></i>
                <h3 class="card-title">Nenhum Plano de Aula Encontrado</h3>
                <p class="card-text">Você ainda não possui nenhum plano de aula atribuído.</p>
            </div>

            <!-- Loop para exibir cada plano de aula -->
            <div th:if="${not #lists.isEmpty(planosDeAula)}" th:each="plano : ${planosDeAula}" class="card plano-aula-card">
                <div class="card-header">
                    <h3 class="card-title" th:text="${plano.nome}"></h3>
                    <span class="badge" th:text="${'Válido de ' + #temporals.format(plano.dataInicio, 'dd/MM/yy') + ' a ' + #temporals.format(plano.dataFim, 'dd/MM/yy')}"></span>
                </div>
                <div class="card-body">
                    <p class="card-text" th:text="${plano.descricao}"></p>
                    
                    <div th:if="${plano.itens != null and not #lists.isEmpty(plano.itens)}">
                        <h4 class="exercicios-header">Exercícios do Plano</h4>
                        
                        <!-- Loop através dos dias da semana agrupados -->
                        <div th:each="entry : ${plano.getItensAgrupadosPorDia()}">
                            <h5 class="dia-semana-header" th:text="${entry.key}"></h5>
                            <ul class="exercicios-list">
                                <!-- Loop através dos exercícios para o dia atual -->
                                <li th:each="item : ${entry.value}">
                                    <strong th:text="${item.exercicio.nome}"></strong>
                                    <span th:text="${' - ' + item.series + 'x' + item.repeticoes}"></span>
                                    <small th:if="${item.observacoes != null and !item.observacoes.trim().isEmpty()}" th:text="${' - ' + item.observacoes}"></small>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<!-- Reutiliza o rodapé do index.html -->
<footer th:replace="~{index :: footer}"></footer>

</body>
</html>
