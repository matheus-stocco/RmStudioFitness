<!--
  Página de Login.
  Utiliza o cabeçalho reutilizável (header) do index.html.
-->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RMStudio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="plan-body">
    
    <!-- Inclui o cabeçalho definido em index.html -->
    <header class="header" th:replace="~{index :: header}"></header>

    <main class="main-content form-page-container">
        <div class="container">
            <h1 class="page-title"><i class="fas fa-sign-in-alt"></i> Acessar minha conta</h1>

            <!-- 
                Formulário de Login.
                - th:action="@{/login}": O atributo 'action' aponta para o endpoint "/login" que o Spring Security
                  monitora para processar as tentativas de autenticação.
                - method="post": O login do Spring Security espera uma requisição POST.
            -->
            <form th:action="@{/login}" method="post" class="card form-card">

                <!-- 
                  Exibição de Erros de Login.
                  - th:if="${param.error}": Esta div só será exibida se a URL contiver um parâmetro "error".
                    O Spring Security adiciona esse parâmetro automaticamente após uma tentativa de login falha.
                -->
                <div th:if="${param.error}" class="form-message error-message">
                    <i class="fas fa-exclamation-triangle"></i>
                    Usuário ou senha inválidos.
                </div>

                <!-- 
                  Exibição de Mensagem de Logout.
                  - th:if="${param.logout}": Esta div só será exibida se a URL contiver um parâmetro "logout".
                    O Spring Security redireciona para cá com esse parâmetro após um logout bem-sucedido.
                -->
                <div th:if="${param.logout}" class="form-message success-message">
                    <i class="fas fa-check-circle"></i>
                    Você saiu com sucesso.
                </div>

                <!-- Campo de Usuário -->
                <div class="form-group">
                    <label for="username">Usuário ou E-mail</label>
                    <!-- 
                      'name="username"': O Spring Security, por padrão, espera que o campo do nome de usuário
                      se chame "username".
                    -->
                    <input type="text" id="username" name="username" placeholder="Digite seu usuário ou e-mail" required autofocus>
                </div>

                <!-- Campo de Senha -->
                <div class="form-group">
                    <label for="password">Senha</label>
                    <!-- 
                      'name="password"': O Spring Security, por padrão, espera que o campo da senha
                      se chame "password".
                    -->
                    <input type="password" id="password" name="password" placeholder="Sua senha" required>
                </div>

                <!-- Campo "Lembrar-me" -->
                <div class="form-group remember-me">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <label for="remember-me">Lembrar-me</label>
                </div>

                <!-- Ações do Formulário -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                    <!-- Link para a página de autocadastro -->
                    <a th:href="@{/autocadastro}" class="btn btn-secondary" style="width: 100%; margin-top: 16px; text-align: center;">
                        Cadastre-se
                    </a>
                </div>

                <div class="form-footer">
                    <a href="#">Esqueceu sua senha?</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Inclui o rodapé definido em index.html -->
    <footer class="footer" th:replace="~{index :: footer}"></footer>

</body>
</html>
