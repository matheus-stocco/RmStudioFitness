<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RMStudio Fitness</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="login-container">
  <div class="card login-card">
    <h1 class="login-title">
      <a class="brand" href="/index.html">
        <i class="fas fa-dumbbell"></i>
        <span>RM</span>Studio
      </a>
    </h1>
    <!-- Mensagens de erro/sucesso agora são tratadas via pop-up -->
    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="username" class="form-label">Usuário:</label>
        <input type="text" id="username" name="username" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Senha:</label>
        <input type="password" id="password" name="password" class="form-control" required>
      </div>
      <div class="form-group">
        <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
      </div>
    </form>
    <div style="text-align: center; margin-top: 16px; margin-bottom: 16px;">
      <a href="/recuperar-senha.html">Esqueceu sua senha?</a>
    </div>

    <div class="separator">ou</div>

    <a th:href="@{/autocadastro}" class="btn btn-secondary" style="width: 100%; margin-top: 16px; text-align: center;">
      Cadastre-se
    </a>
  </div>
</div>

<!-- Contêiner para a notificação -->
<div id="toast-container"></div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);

    function showToast(message, type = 'error', duration = 5000) {
      const container = document.getElementById('toast-container');
      
      const toast = document.createElement('div');
      toast.className = `toast-notification ${type}`;
      
      let iconClass = 'fas fa-exclamation-circle';
      if (type === 'success') {
        iconClass = 'fas fa-check-circle';
      }

      toast.innerHTML = `<i class="${iconClass}"></i> ${message}`;
      
      container.appendChild(toast);

      // Trigger a reflow to enable the animation
      setTimeout(() => {
        toast.classList.add('show');
      }, 10);

      // Hide and remove the toast after the duration
      setTimeout(() => {
        toast.classList.remove('show');
        toast.addEventListener('transitionend', () => toast.remove());
      }, duration);
    }

    if (params.has('error')) {
      showToast('Usuário ou senha inválidos.', 'error');
    }

    if (params.has('logout')) {
      showToast('Você foi desconectado com sucesso.', 'success');
    }
  });
</script>

</body>
</html>
