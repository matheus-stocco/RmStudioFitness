<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - RMStudio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos dos badges de status */
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #fff;
            display: inline-block;
        }
        .status-pendente { background-color: #f0ad4e; }
        .status-pago { background-color: #5cb85c; }
        .status-atrasado { background-color: #d9534f; }
        .status-cancelado { background-color: #6c757d; }

        .filters-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .report-filters {
            display: flex;
            gap: 15px;
            align-items: flex-end; /* Alinha os itens na base */
        }
        .report-filters .filter-group {
            display: flex;
            flex-direction: column; /* Coloca o label acima do select */
            gap: 5px;
        }
        .status-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body class="plan-body">
    
    <header class="header" th:replace="~{index :: header}"></header>

    <main class="main-content form-page-container">
        <div class="container-fluid">
            <h1 class="page-title"><i class="fas fa-chart-line"></i> Relatório de Mensalidades</h1>

            <!-- Cards de Resumo -->
            <div class="summary-cards">
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-dollar-sign"></i></div>
                    <div class="card-content">
                        <span class="card-title">Arrecadado no Mês</span>
                        <span class="card-value" th:text="'R$ ' + ${#numbers.formatDecimal(totalArrecadado, 1, 'POINT', 2, 'COMMA')}"></span>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                    <div class="card-content">
                        <span class="card-title" th:text="'Previsão (' + ${#temporals.format(#temporals.create(anoSelecionado, mesSelecionado, 1), 'MMMM yyyy')} + ')'"></span>
                        <span class="card-value" th:text="'R$ ' + ${#numbers.formatDecimal(previsaoArrecadacao, 1, 'POINT', 2, 'COMMA')}"></span>
                    </div>
                </div>
            </div>

            <div class="card form-card card--wide">
                <!-- Filtros -->
                <div class="filters-container">
                    <form th:action="@{/relatorios/mensalidades}" method="get" class="report-filters">
                        <div class="filter-group">
                            <label for="alunoNome">Aluno:</label>
                            <div class="input-group">
                                <input type="text" name="alunoNome" id="alunoNome" class="form-control" th:value="${alunoNomePesquisado}" placeholder="Nome do Aluno">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i></button>
                            </div>
                        </div>
                        <div class="filter-group">
                            <label for="ano">Ano:</label>
                            <select name="ano" id="ano" class="form-control" onchange="this.form.submit()">
                                <option th:each="a : ${anos}" th:value="${a}" th:text="${a}" th:selected="${a == anoSelecionado}"></option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="mes">Mês:</label>
                            <select name="mes" id="mes" class="form-control" onchange="this.form.submit()">
                                <option value="">Todos</option>
                                <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${#temporals.create(2000, m, 1, 0, 0).month.getDisplayName('FULL', new java.util.Locale('pt', 'BR'))}" th:selected="${m == mesSelecionado}"></option>
                            </select>
                        </div>
                        <input type="hidden" name="status" th:value="${filtroAtual}" />
                    </form>
    
                    <div class="status-filters">
                        <a th:href="@{/relatorios/mensalidades(status='TODAS', ano=${anoSelecionado}, mes=${mesSelecionado}, alunoNome=${alunoNomePesquisado})}" class="btn" th:classappend="${filtroAtual == 'TODAS'} ? 'btn-primary' : 'btn-secondary'">Todas</a>
                        <a th:href="@{/relatorios/mensalidades(status='PAGO', ano=${anoSelecionado}, mes=${mesSelecionado}, alunoNome=${alunoNomePesquisado})}" class="btn" th:classappend="${filtroAtual == 'PAGO'} ? 'btn-primary' : 'btn-secondary'">Pagas</a>
                        <a th:href="@{/relatorios/mensalidades(status='PENDENTE', ano=${anoSelecionado}, mes=${mesSelecionado}, alunoNome=${alunoNomePesquisado})}" class="btn" th:classappend="${filtroAtual == 'PENDENTE'} ? 'btn-primary' : 'btn-secondary'">Pendentes</a>
                        <a th:href="@{/relatorios/mensalidades(status='ATRASADA', ano=${anoSelecionado}, mes=${mesSelecionado}, alunoNome=${alunoNomePesquisado})}" class="btn" th:classappend="${filtroAtual == 'ATRASADA'} ? 'btn-primary' : 'btn-secondary'">Atrasadas</a>
                        <a th:href="@{/relatorios/mensalidades(status='CANCELADO', ano=${anoSelecionado}, mes=${mesSelecionado}, alunoNome=${alunoNomePesquisado})}" class="btn" th:classappend="${filtroAtual == 'CANCELADO'} ? 'btn-primary' : 'btn-secondary'">Canceladas</a>
                    </div>
                     <!-- Botão para Gerar PDF Financeiro -->
                     <div class="pdf-export" th:if="${alunoUnico == null}">
                        <a th:href="@{/relatorios/mensalidades/pdf(ano=${anoSelecionado})}" class="btn btn-danger" target="_blank">
                            <i class="fas fa-file-pdf"></i> Gerar Resumo em PDF
                        </a>
                    </div>

                    <!-- Botão para Gerar PDF do Aluno (condicional) -->
                    <div class="pdf-export" th:if="${alunoUnico != null}">
                        <a th:href="@{/relatorios/mensalidades/aluno/{id}/pdf(id=${alunoUnico.id})}" class="btn btn-success" target="_blank">
                            <i class="fas fa-file-pdf"></i> Gerar PDF de <span th:text="${alunoUnico.primeiroNome()}"></span>
                        </a>
                    </div>
                </div>

                <!-- Tabela de Resultados -->
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Aluno</th>
                                <th>Plano</th>
                                <th>Valor</th>
                                <th>Vencimento</th>
                                <th>Data Pagamento</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${mensalidades.content}">
                                <td th:text="${m.pessoa.nome}"></td>
                                <td th:text="${m.tipoPlano.nome}"></td>
                                <td th:text="${'R$ ' + #numbers.formatDecimal(m.valor, 1, 'POINT', 2, 'COMMA')}"></td>
                                <td th:text="${#temporals.format(m.dataVencimento, 'dd/MM/yyyy')}"></td>
                                <td th:text="${m.dataPagamento != null ? #temporals.format(m.dataPagamento, 'dd/MM/yyyy') : '---'}"></td>
                                <td>
                                    <th:block th:switch="${m.status}">
                                        <span th:case="'PENDENTE'">
                                            <th:block th:if="${m.dataVencimento.isBefore(#temporals.createNow().toLocalDate())}">
                                                <span class="status-badge status-atrasado">ATRASADO</span>
                                            </th:block>
                                            <th:block th:unless="${m.dataVencimento.isBefore(#temporals.createNow().toLocalDate())}">
                                                <span class="status-badge status-pendente">PENDENTE</span>
                                            </th:block>
                                        </span>
                                        <span th:case="'PAGO'" class="status-badge status-pago">PAGO</span>
                                        <span th:case="'CANCELADO'" class="status-badge status-cancelado">CANCELADO</span>
                                        <span th:case="*" class="status-badge" th:text="${m.status}"></span> <!-- Default case -->
                                    </th:block>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(mensalidades.content)}">
                                <td colspan="6" class="text-center">Nenhuma mensalidade encontrada para este filtro.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                 <!-- Controles de Paginação -->
                 <nav aria-label="Page navigation" th:if="${mensalidades.totalPages > 1}">
                    <ul class="pagination">
                        <!-- Botão Anterior -->
                        <li class="page-item" th:classappend="${mensalidades.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/relatorios/mensalidades(status=${filtroAtual}, ano=${anoSelecionado}, mes=${mesSelecionado}, page=${mensalidades.number - 1}, size=${mensalidades.size})}">Anterior</a>
                        </li>

                        <!-- Números de Página -->
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, mensalidades.totalPages - 1)}" th:classappend="${i == mensalidades.number} ? 'active'">
                            <a class="page-link" th:href="@{/relatorios/mensalidades(status=${filtroAtual}, ano=${anoSelecionado}, mes=${mesSelecionado}, page=${i}, size=${mensalidades.size})}" th:text="${i + 1}"></a>
                        </li>

                        <!-- Botão Próximo -->
                        <li class="page-item" th:classappend="${mensalidades.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/relatorios/mensalidades(status=${filtroAtual}, ano=${anoSelecionado}, mes=${mesSelecionado}, page=${mensalidades.number + 1}, size=${mensalidades.size})}">Próximo</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <footer class="footer" th:replace="~{index :: footer}"></footer>

</body>
</html>
