<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Membros - RM Studio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="plan-body">

    <header class="header" th:replace="~{index :: header}"></header>

    <main class="main-content form-page-container">
        <div class="container-fluid">
            <h1 class="page-title"><i class="fas fa-users"></i> Relatório de Membros Cadastrados</h1>

            <!-- Cards de Resumo -->
            <div class="summary-cards">
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-users"></i></div>
                    <div class="card-content">
                        <span class="card-title">Total de Membros</span>
                        <span class="card-value">[[${totalMembros}]]</span>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-venus-mars"></i></div>
                    <div class="card-content">
                        <span class="card-title">Gênero</span>
                        <span class="card-value-small" th:text="'M: ' + ${totalMasculino} + ' | F: ' + ${totalFeminino} + ' | O: ' + ${totalOutro}"></span>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-user-check"></i></div>
                    <div class="card-content">
                        <span class="card-title">Ativos</span>
                        <span class="card-value" th:text="${totalAtivos}"></span>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-user-clock"></i></div>
                    <div class="card-content">
                        <span class="card-title">Ociosos</span>
                        <span class="card-value" th:text="${totalOciosos}"></span>
                    </div>
                </div>
            </div>

            <div class="card form-card card--wide">
                <div class="filters-container">
                    <div class="status-filters">
                        <a th:href="@{/relatorios/membros(status='TODOS')}"
                           class="btn" th:classappend="${filtroStatus == 'TODOS'} ? 'btn-primary' : 'btn-secondary'">Todos</a>
                        <a th:href="@{/relatorios/membros(status='ATIVO')}"
                           class="btn" th:classappend="${filtroStatus == 'ATIVO'} ? 'btn-primary' : 'btn-secondary'">Ativos</a>
                        <a th:href="@{/relatorios/membros(status='OCIOSO')}"
                           class="btn" th:classappend="${filtroStatus == 'OCIOSO'} ? 'btn-primary' : 'btn-secondary'">Ociosos</a>
                    </div>
                    
                    <div class="filter-actions">
                        <form th:action="@{/relatorios/membros}" method="get" class="search-form">
                            <input type="hidden" name="status" th:value="${filtroStatus}" />
                            <input type="text" name="nome" th:value="${nomePesquisado}" placeholder="Pesquisar por nome..." class="form-control">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i></button>
                        </form>

                        <!-- Botão para gerar PDF -->
                        <a th:href="@{/relatorios/membros/pdf(status=${filtroStatus}, nome=${nomePesquisado}, sort=${param.sort})}" 
                           class="btn btn-secondary" 
                           title="Gerar Relatório em PDF">
                           <i class="fas fa-file-pdf"></i>
                        </a>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th th:with="sortField='id', currentSort=${membros.sort.getOrderFor(sortField)}, nextDirection=${(currentSort != null && currentSort.isAscending()) ? 'desc' : 'asc'}, sortParam=${sortField + ',' + nextDirection}">
                                    <a th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, sort=${sortParam})}">
                                        ID <i class="fas" th:classappend="${currentSort == null ? 'fa-sort' : (currentSort.isAscending() ? 'fa-sort-up' : 'fa-sort-down')}"></i>
                                    </a>
                                </th>
                                <th th:with="sortField='nome', currentSort=${membros.sort.getOrderFor(sortField)}, nextDirection=${(currentSort != null && currentSort.isAscending()) ? 'desc' : 'asc'}, sortParam=${sortField + ',' + nextDirection}">
                                    <a th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, sort=${sortParam})}">
                                        NOME <i class="fas" th:classappend="${currentSort == null ? 'fa-sort' : (currentSort.isAscending() ? 'fa-sort-up' : 'fa-sort-down')}"></i>
                                    </a>
                                </th>
                                <th th:with="sortField='email', currentSort=${membros.sort.getOrderFor(sortField)}, nextDirection=${(currentSort != null && currentSort.isAscending()) ? 'desc' : 'asc'}, sortParam=${sortField + ',' + nextDirection}">
                                    <a th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, sort=${sortParam})}">
                                        EMAIL <i class="fas" th:classappend="${currentSort == null ? 'fa-sort' : (currentSort.isAscending() ? 'fa-sort-up' : 'fa-sort-down')}"></i>
                                    </a>
                                </th>
                                <th>CPF</th>
                                <th>TELEFONE</th>
                                <th th:with="sortField='dataNascimento', currentSort=${membros.sort.getOrderFor(sortField)}, nextDirection=${(currentSort != null && currentSort.isAscending()) ? 'desc' : 'asc'}, sortParam=${sortField + ',' + nextDirection}">
                                    <a th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, sort=${sortParam})}">
                                        DATA DE NASCIMENTO <i class="fas" th:classappend="${currentSort == null ? 'fa-sort' : (currentSort.isAscending() ? 'fa-sort-up' : 'fa-sort-down')}"></i>
                                    </a>
                                </th>
                                 <th th:with="sortField='genero', currentSort=${membros.sort.getOrderFor(sortField)}, nextDirection=${(currentSort != null && currentSort.isAscending()) ? 'desc' : 'asc'}, sortParam=${sortField + ',' + nextDirection}">
                                    <a th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, sort=${sortParam})}">
                                        GÊNERO <i class="fas" th:classappend="${currentSort == null ? 'fa-sort' : (currentSort.isAscending() ? 'fa-sort-up' : 'fa-sort-down')}"></i>
                                    </a>
                                </th>
                                <th th:with="sortField='dataCadastro', currentSort=${membros.sort.getOrderFor(sortField)}, nextDirection=${(currentSort != null && currentSort.isAscending()) ? 'desc' : 'asc'}, sortParam=${sortField + ',' + nextDirection}">
                                    <a th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, sort=${sortParam})}">
                                        DATA DE CADASTRO <i class="fas" th:classappend="${currentSort == null ? 'fa-sort' : (currentSort.isAscending() ? 'fa-sort-up' : 'fa-sort-down')}"></i>
                                    </a>
                                </th>
                                <th th:with="sortField='planoAtivo', currentSort=${membros.sort.getOrderFor(sortField)}, nextDirection=${(currentSort != null && currentSort.isAscending()) ? 'desc' : 'asc'}, sortParam=${sortField + ',' + nextDirection}">
                                    <a th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, sort=${sortParam})}">
                                        STATUS <i class="fas" th:classappend="${currentSort == null ? 'fa-sort' : (currentSort.isAscending() ? 'fa-sort-up' : 'fa-sort-down')}"></i>
                                    </a>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="membro : ${membros.content}">
                                <td th:text="${membro.id}"></td>
                                <td th:text="${membro.nome}"></td>
                                <td th:text="${membro.email}"></td>
                                <td th:text="${membro.getCpfFormatado()}"></td>
                                <td th:text="${membro.telefone}"></td>
                                <td th:text="${membro.getDataNascimentoFormatada()}"></td>
                                <td th:text="${membro.getGeneroDescricao()}"></td>
                                <td th:text="${membro.getDataCadastroFormatada()}"></td>
                                <td>
                                    <span class="status-badge" th:classappend="${membro.planoAtivo != null} ? 'status-ativo' : 'status-ocioso'"
                                          th:text="${membro.planoAtivo != null} ? 'ATIVO' : 'OCIOSO'"></span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(membros.content)}">
                                <td colspan="10" class="text-center">Nenhum membro encontrado para este filtro.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Controles de Paginação -->
                <nav aria-label="Page navigation" th:if="${membros.totalPages > 1}">
                    <ul class="pagination">
                        <!-- Botão Anterior -->
                        <li class="page-item" th:classappend="${membros.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, page=${membros.number - 1}, size=${membros.size})}">Anterior</a>
                        </li>

                        <!-- Números de Página -->
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, membros.totalPages - 1)}" th:classappend="${i == membros.number} ? 'active'">
                            <a class="page-link" th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, page=${i}, size=${membros.size})}" th:text="${i + 1}"></a>
                        </li>

                        <!-- Botão Próximo -->
                        <li class="page-item" th:classappend="${membros.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, page=${membros.number + 1}, size=${membros.size})}">Próximo</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <footer class="footer" th:replace="~{index :: footer}"></footer>

</body>
</html>
