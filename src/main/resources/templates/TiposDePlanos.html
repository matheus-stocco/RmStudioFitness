<!--
  Página de Planos.
  Esta página tem a função de exibir todos os planos disponíveis, buscando os dados dinamicamente da API.
  É muito semelhante à seção de planos da página inicial, mas em uma página dedicada.
-->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale-1.0">
  <title>Nossos Planos - RMStudio Fitness</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Reutiliza o fragmento "header" definido em index.html -->
  <header class="header" th:replace="~{index :: header}"></header>

  <main class="main-content form-page-container">
    <section id="planos" class="section">
      <div class="container">
        <h1 class="page-title">Nossos Planos</h1>
        <p class="page-subtitle">Escolha o plano que melhor se adapta a você.</p>
        
        <div class="planos-grid">
            <!-- Loop sobre os planos passados pelo controller -->
            <div th:each="plano, iterStat : ${planos}" th:classappend="${iterStat.index == 1} ? 'destaque' : ''" class="plano-card">
                
                <span th:if="${iterStat.index == 1}" class="destaque-badge">Mais Popular</span>
                
                <h3 class="plano-titulo" th:text="${plano.nome}"></h3>
                <p class="plano-preco">R$ <span th:text="${#numbers.formatDecimal(plano.valor, 1, 'POINT', 2, 'COMMA')}"></span> /mês</p>
                
                <ul class="plano-beneficios">
                    <li th:each="item : ${plano.descricao.split(';')}">
                        <i class="fas fa-check"></i> <span th:text="${item.trim()}"></span>
                    </li>
                </ul>

                <!-- Botão para NÃO LOGADOS -->
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/autocadastro}" class="btn btn-primary">Matricule-se Já</a>
                </div>

                <!-- Botão para LOGADOS -->
                <div sec:authorize="isAuthenticated()">
                    <form th:action="@{/planos/inscrever/{planoId}(planoId=${plano.id})}" method="post" class="form-contratar-plano"
                          th:attr="data-confirm-troca='Tem certeza que deseja trocar seu plano? As cobranças pendentes do plano atual serão canceladas. Uma nova cobrança será gerada.', 
                                   data-confirm-novo='Tem certeza que deseja contratar este plano? Uma nova cobrança será gerada.', 
                                   data-plano-ativo=${planoAtivo != null}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-primary">Contratar Plano</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer" th:replace="~{index :: footer}"></footer>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const forms = document.querySelectorAll('.form-contratar-plano');
    forms.forEach(form => {
        form.addEventListener('submit', (event) => {
            const planoAtivo = form.getAttribute('data-plano-ativo') === 'true';
            const msgTroca = form.getAttribute('data-confirm-troca');
            const msgNovo = form.getAttribute('data-confirm-novo');
            
            const mensagem = planoAtivo ? msgTroca : msgNovo;
            
            if (!confirm(mensagem)) {
                event.preventDefault(); // Cancela o envio do formulário se o usuário clicar em "Cancelar"
            }
        });
    });
});
</script>
</body>
</html>
