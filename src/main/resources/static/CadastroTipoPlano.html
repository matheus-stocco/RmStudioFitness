<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Tipos de Plano</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <h1>Cadastro de Tipos de Plano</h1>

  <!-- Formulário -->
  <form action="/api/tipos-plano" method="post">
    <div>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>
    </div>

    <div>
      <label for="descricao">Descrição:</label>
      <textarea id="descricao" name="descricao"></textarea>
    </div>

    <div>
      <label for="valor">Valor (R$):</label>
      <input type="number" id="valor" name="valor" step="0.01" required>
    </div>

    <div>
      <button type="submit">Salvar</button>
      <button type="reset">Novo</button>
    </div>
  </form>

  <!-- Tabela de listagem -->
  <h2>Lista de Tipos de Plano</h2>
  <table border="1">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Valor</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <!-- Aqui o backend ou JavaScript preencherá a lista -->
      <tr>
        <td>Exemplo</td>
        <td>Descrição de exemplo</td>
        <td>99.90</td>
        <td>
          <button>Editar</button>
          <button>Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
