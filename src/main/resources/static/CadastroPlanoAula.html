<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Planos de Aula - RMStudio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a class="brand" href="/index.html"><i class="fas fa-dumbbell"></i> <span>RM</span>Studio</a>
                <button class="nav-toggle" aria-label="Abrir menu"><i class="fas fa-bars"></i></button>
                <div class="nav-links">
                    <a href="/index.html">Home</a>
                    <a href="/CadastroPessoas.html">Membros</a>
                    <a class="active" href="/CadastroPlanoAula.html">Planos</a>
                    <a href="/CadastroExercicios.html">Exercícios</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="form-page-container">
        <div class="container">
            <h1 class="page-title"><i class="fas fa-calendar-alt"></i> Gestão de Planos de Aula</h1>

            <div class="card form-card">
                <h3 class="card-title">Adicionar / Editar Plano</h3>
                <form id="form-plano-aula">
                    <input type="hidden" id="id" name="id">
                    <div class="form-group">
                        <label for="descricao" class="form-label">Descrição do Plano</label>
                        <input type="text" id="descricao" name="descricao" class="form-control" required placeholder="Ex: Treino de Hipertrofia A/B">
                    </div>
                     <div class="form-group">
                        <label for="alunoId" class="form-label">Aluno</label>
                        <select id="alunoId" name="alunoId" class="form-control" required>
                            <option value="">Carregando...</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar Plano</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-plus"></i> Novo</button>
                    </div>
                </form>
            </div>

            <div class="card" style="margin-top: 32px;">
                <h3 class="card-title">Planos Cadastrados</h3>
                <div class="table-responsive">
                    <table class="table" id="tabela-planos">
                        <thead>
                            <tr>
                                <th>Descrição</th>
                                <th>Aluno</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 RMStudio Fitness. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script>
        const API_URL = '/api/planoaulas';
        const API_ALUNOS_URL = '/api/pessoas';
        const form = document.getElementById('form-plano-aula');
        const tableBody = document.querySelector('#tabela-planos tbody');

        async function fetchPlanos() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro ao buscar planos');
                const planos = await response.json();
                renderTable(planos);
            } catch (error) {
                console.error('Falha:', error);
                tableBody.innerHTML = `<tr><td colspan="3">Erro ao carregar planos.</td></tr>`;
            }
        }

        async function fetchAlunos() {
            const alunoSelect = document.getElementById('alunoId');
            try {
                const response = await fetch(API_ALUNOS_URL);
                if (!response.ok) throw new Error('Erro ao buscar alunos');
                const alunos = await response.json();
                alunoSelect.innerHTML = '<option value="">Selecione um aluno</option>';
                alunos.forEach(aluno => {
                    alunoSelect.innerHTML += `<option value="${aluno.id}">${aluno.nome}</option>`;
                });
            } catch (error) {
                console.error(error);
                alunoSelect.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        function renderTable(planos) {
            tableBody.innerHTML = '';
             if (planos.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Nenhum plano cadastrado.</td></tr>`;
                return;
            }
            planos.forEach(plano => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${plano.descricao}</td>
                    <td>${plano.aluno ? plano.aluno.nome : 'N/A'}</td>
                    <td class="cell-actions">
                        <a href="/CadastroItensPlano.html?planoId=${plano.id}" class="btn btn-secondary"><i class="fas fa-plus"></i> Itens</a>
                        <button class="btn btn-secondary" onclick="editPlano('${plano.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-secondary" onclick="deletePlano('${plano.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const id = formData.get('id');
            const payload = {
                descricao: formData.get('descricao'),
                aluno: { id: formData.get('alunoId') }
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Erro ao salvar plano');
                }
                resetForm();
                fetchPlanos();
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        });

        async function editPlano(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                if (!response.ok) throw new Error('Plano não encontrado');
                const plano = await response.json();
                document.getElementById('id').value = plano.id;
                document.getElementById('descricao').value = plano.descricao;
                if(plano.aluno) {
                    document.getElementById('alunoId').value = plano.aluno.id;
                }
                window.scrollTo(0, 0);
            } catch (error) {
                console.error('Falha ao carregar para edição:', error);
            }
        }

        async function deletePlano(id) {
            if (!confirm('Tem certeza que deseja excluir este plano?')) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Erro ao excluir');
                fetchPlanos();
            } catch (error) {
                console.error('Falha ao excluir:', error);
            }
        }
        
        function resetForm() {
            form.reset();
            document.getElementById('id').value = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPlanos();
            fetchAlunos();
        });
        
        // Mobile nav toggle
        const navToggle = document.querySelector('.nav-toggle');
        const navLinks = document.querySelector('.nav-links');
        if (navToggle) {
            navToggle.addEventListener('click', () => {
                navLinks.classList.toggle('open');
            });
        }
    </script>
</body>
</html>
