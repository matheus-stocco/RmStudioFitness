<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Novo Membro - RMStudio Fitness</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="navbar">
        <a class="brand" href="/index.html">
          <i class="fas fa-dumbbell"></i>
          <span>RM</span>Studio
        </a>
        <button class="nav-toggle" aria-label="Abrir menu">
          <i class="fas fa-bars"></i>
        </button>
        <div class="nav-links">
          <a href="/login.html">Login</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="form-page-container">
    <div class="container">
      <h1 class="page-title"><i class="fas fa-user-plus"></i> Cadastre-se</h1>

      <!-- Formulário de Cadastro -->
      <div class="card form-card">
        <h3 class="card-title">Crie sua Conta</h3>
        <form id="form-pessoas">
          <input type="hidden" id="id" name="id">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="form-group">
            <label for="nome" class="form-label">Nome Completo:</label>
            <input type="text" id="nome" name="nome" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="email" class="form-label">E-mail:</label>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="telefone" class="form-label">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(00) 00000-0000" required>
          </div>
          <div class="form-group">
            <label for="genero" class="form-label">Gênero:</label>
            <select id="genero" name="genero" class="form-control" required>
              <option value="">Selecione…</option>
              <option value="MASCULINO">Masculino</option>
              <option value="FEMININO">Feminino</option>
              <option value="OUTRO">Outro</option>
            </select>
          </div>
           <div class="form-group">
            <label for="usuario" class="form-label">Usuário:</label>
            <input type="text" id="usuario" name="usuario" class="form-control" required>
          </div>
           <div class="form-group">
            <label for="senha" class="form-label">Senha:</label>
            <input type="password" id="senha" name="senha" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="dataNascimento" class="form-label">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" name="dataNascimento" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="cpf" class="form-label">CPF:</label>
            <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00" required>
          </div>
          <div class="form-group">
              <label for="estadoId" class="form-label">Estado</label>
              <select id="estadoId" name="estadoId" class="form-control" required>
                  <option value="">Carregando...</option>
              </select>
          </div>
          <div class="form-group">
              <label for="cidadeId" class="form-label">Cidade</label>
              <select id="cidadeId" name="cidadeId" class="form-control" disabled required>
                  <option value="">Selecione um estado</option>
              </select>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-save"></i> Cadastrar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2024 RMStudio Fitness. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script>
    const API_URL = '/api/pessoas';
    const form = document.getElementById('form-pessoas');

    function resetForm() {
        form.reset();
        document.getElementById('cidadeId').innerHTML = '<option value="">Selecione um estado</option>';
        document.getElementById('cidadeId').disabled = true;
    }

    // Função para obter o token CSRF
    function getCsrfToken() {
        const tokenElement = document.querySelector('input[name="_csrf"]');
        return tokenElement ? tokenElement.value : '';
    }

    // Carregamento de Estados e Cidades
    async function getEstados() {
        const estadoSelect = document.getElementById('estadoId');
        try {
            const response = await fetch('/api/estados');
            if (!response.ok) throw new Error('Erro ao buscar estados');
            const estados = await response.json();
            estadoSelect.innerHTML = '<option value="">Selecione um estado</option>';
            estados.forEach(estado => {
                const option = document.createElement('option');
                option.value = estado.id;
                option.textContent = `${estado.uf} - ${estado.nome}`;
                estadoSelect.appendChild(option);
            });
        } catch (error) {
            console.error(error);
            estadoSelect.innerHTML = '<option value="">Erro ao carregar</option>';
        }
    }

    async function getCidadesPorEstado(estadoId) {
        const cidadeSelect = document.getElementById('cidadeId');
        if (!estadoId) {
            cidadeSelect.innerHTML = '<option value="">Selecione um estado</option>';
            cidadeSelect.disabled = true;
            return;
        }
        cidadeSelect.disabled = true;
        cidadeSelect.innerHTML = '<option value="">Carregando...</option>';
        try {
            const response = await fetch(`/api/cidades/por-estado/${estadoId}`);
            if (!response.ok) throw new Error('Erro ao buscar cidades');
            const cidades = await response.json();

            cidadeSelect.innerHTML = '<option value="">Selecione uma cidade</option>';
            cidades.forEach(cidade => {
                const option = document.createElement('option');
                option.value = cidade.id;
                option.textContent = cidade.nome;
                cidadeSelect.appendChild(option);
            });
            cidadeSelect.disabled = false;
        } catch (error) {
            console.error('Falha na função getCidadesPorEstado:', error);
            cidadeSelect.innerHTML = '<option value="">Erro ao carregar</option>';
        }
    }

    // Event Listeners
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const pessoa = Object.fromEntries(formData.entries());
        
        const payload = {
            nome: pessoa.nome,
            email: pessoa.email,
            telefone: pessoa.telefone,
            genero: pessoa.genero,
            usuario: pessoa.usuario,
            senha: pessoa.senha,
            dataNascimento: pessoa.dataNascimento,
            cpf: pessoa.cpf,
            cidade: { id: pessoa.cidadeId }
        };
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': getCsrfToken()
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                 const errorData = await response.json();
                 throw new Error(errorData.message || 'Erro ao cadastrar. Tente novamente.');
            }
            
            alert('Cadastro realizado com sucesso! Você será redirecionado para a página de login.');
            window.location.href = '/login.html';

        } catch (error) {
            console.error('Falha ao cadastrar:', error);
            alert(error.message);
        }
    });

    document.getElementById('estadoId').addEventListener('change', (e) => {
        getCidadesPorEstado(e.target.value);
    });

    document.addEventListener('DOMContentLoaded', () => {
        getEstados();
    });
    
    // Mobile nav toggle
    const navToggle = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');
    if (navToggle) {
        navToggle.addEventListener('click', () => {
            navLinks.classList.toggle('open');
        });
    }
  </script>
</body>
</html>
