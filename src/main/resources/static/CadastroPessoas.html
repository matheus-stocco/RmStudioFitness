<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Membros - RMStudio Fitness</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="navbar">
        <a class="brand" href="/index.html">
          <i class="fas fa-dumbbell"></i>
          <span>RM</span>Studio
        </a>
        <button class="nav-toggle" aria-label="Abrir menu">
          <i class="fas fa-bars"></i>
        </button>
        <div class="nav-links">
          <a href="/index.html">Home</a>
          <a class="active" href="/CadastroPessoas.html">Membros</a>
          <a href="/CadastroPlanoAula.html">Planos</a>
          <a href="/CadastroExercicios.html">Exercícios</a>
          <a href="/CadastroAvaliacaoFisica.html">Avaliações</a>
          <a href="/CadastroTipoPlano.html">Tipos de Plano</a>
          <a href="/CadastroEstado.html">Estados</a>
          <a href="/CadastroCidade.html">Cidades</a>
          <a href="/login.html">Login</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="form-page-container">
    <div class="container">
      <h1 class="page-title"><i class="fas fa-users"></i> Gestão de Membros</h1>

      <!-- Formulário de Cadastro -->
      <div class="card form-card">
        <h3 class="card-title">Cadastrar Novo Membro</h3>
        <form id="form-pessoas">
          <input type="hidden" id="id" name="id">
          <div class="form-group">
            <label for="nome" class="form-label">Nome Completo:</label>
            <input type="text" id="nome" name="nome" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="email" class="form-label">E-mail:</label>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="telefone" class="form-label">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(00) 00000-0000">
          </div>
          <div class="form-group">
            <label for="genero" class="form-label">Gênero:</label>
            <select id="genero" name="genero" class="form-control">
              <option value="">Selecione…</option>
              <option value="MASCULINO">Masculino</option>
              <option value="FEMININO">Feminino</option>
              <option value="OUTRO">Outro</option>
            </select>
          </div>
           <div class="form-group">
            <label for="usuario" class="form-label">Usuário:</label>
            <input type="text" id="usuario" name="usuario" class="form-control" required>
          </div>
           <div class="form-group">
            <label for="senha" class="form-label">Senha:</label>
            <input type="password" id="senha" name="senha" class="form-control" required>
          </div>
          <div class="form-group">
              <label for="estadoId" class="form-label">Estado</label>
              <select id="estadoId" name="estadoId" class="form-control" required>
                  <option value="">Carregando...</option>
              </select>
          </div>
          <div class="form-group">
              <label for="cidadeId" class="form-label">Cidade</label>
              <select id="cidadeId" name="cidadeId" class="form-control" required disabled>
                  <option value="">Selecione um estado</option>
              </select>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()">
                <i class="fas fa-plus"></i> Novo
            </button>
          </div>
        </form>
      </div>

      <!-- Lista de Pessoas -->
      <div class="card" style="margin-top: 32px;">
        <h3 class="card-title">Membros Cadastrados</h3>
        <div class="table-responsive">
          <table class="table" id="tabela-pessoas">
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Gênero</th>
                <th>Cidade/UF</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <!-- Os dados serão inseridos aqui via JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2024 RMStudio Fitness. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script>
    const API_URL = '/api/pessoas';
    const form = document.getElementById('form-pessoas');
    const tableBody = document.querySelector('#tabela-pessoas tbody');

    // Funções de interação com a API
    async function getPessoas() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Erro ao buscar pessoas');
            const pessoas = await response.json();
            renderTable(pessoas);
        } catch (error) {
            console.error(error);
            // Adicionar feedback de erro para o usuário aqui
        }
    }

    async function addPessoa(pessoa) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pessoa)
            });
            if (!response.ok) throw new Error('Erro ao adicionar pessoa');
            resetForm();
            getPessoas();
        } catch (error) {
            console.error(error);
        }
    }

    async function updatePessoa(id, pessoa) {
        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pessoa)
            });
            if (!response.ok) throw new Error('Erro ao atualizar pessoa');
            resetForm();
            getPessoas();
        } catch (error) {
            console.error(error);
        }
    }

    async function deletePessoa(id) {
        if (!confirm('Tem certeza que deseja excluir esta pessoa?')) return;
        try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (!response.ok) throw new Error('Erro ao excluir pessoa');
            getPessoas();
        } catch (error) {
            console.error(error);
        }
    }

    // Renderização e manipulação do DOM
    function renderTable(pessoas) {
        tableBody.innerHTML = '';
        if (!pessoas || pessoas.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhum membro cadastrado.</td></tr>';
            return;
        }
        pessoas.forEach(pessoa => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${pessoa.nome}</td>
                <td>${pessoa.email}</td>
                <td>${pessoa.telefone || 'N/A'}</td>
                <td>${pessoa.genero || 'N/A'}</td>
                <td>${pessoa.cidade ? `${pessoa.cidade.nome}/${pessoa.cidade.estado.sigla}` : 'N/A'}</td>
                <td class="cell-actions">
                    <button class="btn btn-secondary" onclick="editPessoa('${pessoa.id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-secondary" onclick="deletePessoa('${pessoa.id}')"><i class="fas fa-trash"></i></button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    async function editPessoa(id) {
        try {
            const response = await fetch(`${API_URL}/${id}`);
            if (!response.ok) throw new Error('Pessoa não encontrada');
            const pessoa = await response.json();
            document.getElementById('id').value = pessoa.id;
            document.getElementById('nome').value = pessoa.nome;
            document.getElementById('email').value = pessoa.email;
            document.getElementById('telefone').value = pessoa.telefone;
            document.getElementById('genero').value = pessoa.genero;
            document.getElementById('usuario').value = pessoa.usuario;
            
            // Lógica para carregar e selecionar estado/cidade
            const estadoSelect = document.getElementById('estadoId');
            const cidadeSelect = document.getElementById('cidadeId');
            
            await getEstados(); // Garante que estados estão carregados
            if (pessoa.cidade && pessoa.cidade.estado) {
                estadoSelect.value = pessoa.cidade.estado.id;
                await getCidadesPorEstado(pessoa.cidade.estado.id);
                cidadeSelect.value = pessoa.cidade.id;
            }
            
            window.scrollTo(0, 0); // Rola para o topo para editar
        } catch (error) {
            console.error(error);
        }
    }

    function resetForm() {
        form.reset();
        document.getElementById('id').value = '';
        document.getElementById('cidadeId').innerHTML = '<option value="">Selecione um estado</option>';
        document.getElementById('cidadeId').disabled = true;
    }

    // Carregamento de Estados e Cidades
    async function getEstados() {
        const estadoSelect = document.getElementById('estadoId');
        try {
            const response = await fetch('/api/estados');
            if (!response.ok) throw new Error('Erro ao buscar estados');
            const estados = await response.json();
            estadoSelect.innerHTML = '<option value="">Selecione um estado</option>';
            estados.forEach(estado => {
                const option = document.createElement('option');
                option.value = estado.id;
                option.textContent = `${estado.sigla} - ${estado.nome}`;
                estadoSelect.appendChild(option);
            });
        } catch (error) {
            console.error(error);
            estadoSelect.innerHTML = '<option value="">Erro ao carregar</option>';
        }
    }

    async function getCidadesPorEstado(estadoId) {
        const cidadeSelect = document.getElementById('cidadeId');
        if (!estadoId) {
            cidadeSelect.innerHTML = '<option value="">Selecione um estado</option>';
            cidadeSelect.disabled = true;
            return;
        }
        cidadeSelect.disabled = true;
        cidadeSelect.innerHTML = '<option value="">Carregando...</option>';
        try {
            const response = await fetch(`/api/cidades/por-estado/${estadoId}`);
            if (!response.ok) throw new Error('Erro ao buscar cidades');
            const cidades = await response.json();
            cidadeSelect.innerHTML = '<option value="">Selecione uma cidade</option>';
            cidades.forEach(cidade => {
                const option = document.createElement('option');
                option.value = cidade.id;
                option.textContent = cidade.nome;
                cidadeSelect.appendChild(option);
            });
            cidadeSelect.disabled = false;
        } catch (error) {
            console.error(error);
            cidadeSelect.innerHTML = '<option value="">Erro ao carregar</option>';
        }
    }

    // Event Listeners
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const pessoa = Object.fromEntries(formData.entries());
        const id = pessoa.id;
        
        // Estrutura o payload para o backend
        const payload = {
            id: pessoa.id || null,
            nome: pessoa.nome,
            email: pessoa.email,
            telefone: pessoa.telefone,
            genero: pessoa.genero,
            usuario: pessoa.usuario,
            senha: pessoa.senha,
            cidade: { id: pessoa.cidadeId }
        };

        if (id) {
            updatePessoa(id, payload);
        } else {
            addPessoa(payload);
        }
    });

    document.getElementById('estadoId').addEventListener('change', (e) => {
        getCidadesPorEstado(e.target.value);
    });

    document.addEventListener('DOMContentLoaded', () => {
        getPessoas();
        getEstados();
    });
    
    // Mobile nav toggle
    const navToggle = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');
    if (navToggle) {
        navToggle.addEventListener('click', () => {
            navLinks.classList.toggle('open');
        });
    }
  </script>
</body>
</html>
