<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Pessoas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <h1>Cadastro de Pessoas</h1>

  <!-- Formulário -->
  <form action="/api/pessoas" method="post">
    <div>
      <label for="usuario">Usuário:</label>
      <input type="text" id="usuario" name="usuario" required>
    </div>

    <div>
      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required>
    </div>

    <div>
      <label for="nome">Nome Completo:</label>
      <input type="text" id="nome" name="nome" required>
    </div>

    <div>
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div>
      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
    </div>

    <div>
      <label for="genero">Gênero:</label>
      <select id="genero" name="genero">
        <option value="">Selecione…</option>
        <option value="M">Masculino</option>
        <option value="F">Feminino</option>
        <option value="O">Outro</option>
      </select>
    </div>

    <div>
      <label for="estadoId">Estado:</label>
      <select id="estadoId" name="estadoId" required>
        <option value="">Selecione o estado…</option>
        <!-- O backend deve preencher estes options dinamicamente -->
        <!-- <option value="1">SP – São Paulo</option> -->
      </select>
    </div>

    <div>
      <label for="cidadeId">Cidade:</label>
      <select id="cidadeId" name="cidadeId" required>
        <option value="">Selecione a cidade…</option>
        <!-- O backend deve preencher estes options conforme o estado -->
      </select>
    </div>

    <div>
      <button type="submit">Salvar</button>
      <button type="reset">Novo</button>
    </div>
  </form>

  <!-- Lista -->
  <h2>Pessoas Cadastradas</h2>
  <table border="1">
    <thead>
      <tr>
        <th>Usuário</th>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Gênero</th>
        <th>Cidade</th>
        <th>Estado</th>
        <th>Data Cadastro</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <!-- O backend ou JavaScript preencherá a lista -->
      <tr>
        <td>exemplo.user</td>
        <td>Nome Exemplo</td>
        <td>exemplo@dominio.com</td>
        <td>(11) 90000-0000</td>
        <td>M</td>
        <td>São Paulo</td>
        <td>SP</td>
        <td>01/01/2025</td>
        <td>
          <button>Editar</button>
          <button>Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
