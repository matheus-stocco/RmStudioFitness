<!--
  Página de Autocadastro de Novos Usuários.
  Permite que visitantes criem uma nova conta.
-->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se - RMStudio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Reutiliza o cabeçalho do index.html -->
    <header class="header" th:replace="~{index :: header}"></header>

    <main class="main-content form-page-container">
        <div class="container">
            <h1 class="page-title"><i class="fas fa-user-plus"></i> Crie sua conta</h1>

            <!-- 
                Formulário de Cadastro
                - Não tem 'action' nem 'method' no HTML, pois o envio será controlado pelo JavaScript.
            -->
            <form id="cadastroForm" class="card form-card">
                <!-- Seção para exibir mensagens de erro da API -->
                <div id="error-message" class="form-message error-message" style="display: none;"></div>

                <!-- Campos do formulário -->
                <div class="form-group-grid">
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <!-- ... outros campos ... -->
                    <div class="form-group">
                        <label for="usuario">Usuário</label>
                        <input type="text" id="usuario" name="usuario" required>
                    </div>
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required>
                    </div>
                    <div class="form-group">
                        <label for="dataNascimento">Data de Nascimento</label>
                        <input type="date" id="dataNascimento" name="dataNascimento" required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone">
                    </div>
                    <div class="form-group">
                        <label for="genero">Gênero</label>
                        <select id="genero" name="genero">
                            <option value="">Selecione...</option>
                            <option value="MASCULINO">Masculino</option>
                            <option value="FEMININO">Feminino</option>
                            <option value="OUTRO">Outro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" required>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <select id="estado" name="estado" required>
                            <option value="">Carregando...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <select id="cidade" name="cidade" required disabled>
                            <option value="">Selecione um estado</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Reutiliza o rodapé do index.html -->
    <footer class="footer" th:replace="~{index :: footer}"></footer>

    <!-- 
        SCRIPTS JAVASCRIPT
        Esta seção contém toda a lógica para:
        1. Carregar os estados e cidades dinamicamente.
        2. Enviar os dados do formulário para a API de criação de pessoas.
        3. Tratar as respostas (sucesso e erro) da API.
    -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Seleciona o formulário de cadastro
            const cadastroForm = document.getElementById('cadastroForm');

            // --- SÓ EXECUTA O SCRIPT SE ESTIVER NA PÁGINA DE CADASTRO ---
            if (cadastroForm) {
                const estadoSelect = document.getElementById('estado');
                const cidadeSelect = document.getElementById('cidade');
                const errorMessageDiv = document.getElementById('error-message');
                const cpfInput = document.getElementById('cpf');
                const telefoneInput = document.getElementById('telefone');

                // --- MÁSCARAS DE INPUT ---
                cpfInput.addEventListener('input', (e) => {
                    let value = e.target.value.replace(/\D/g, ''); // Remove tudo que não é dígito
                    value = value.slice(0, 11); // Limita aos 11 dígitos do CPF
                    value = value.replace(/(\d{3})(\d)/, '$1.$2');
                    value = value.replace(/(\d{3})(\d)/, '$1.$2');
                    value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                    e.target.value = value;
                });

                telefoneInput.addEventListener('input', (e) => {
                    let value = e.target.value.replace(/\D/g, ''); // Remove tudo que não é dígito
                    value = value.slice(0, 11); // Limita aos 11 dígitos do telefone
                    if (value.length > 10) {
                        value = value.replace(/^(\d\d)(\d{5})(\d{4}).*/, '($1) $2-$3');
                    } else {
                        value = value.replace(/^(\d\d)(\d{4})(\d{0,4}).*/, '($1) $2-$3');
                    }
                    e.target.value = value;
                });


                // --- 1. CARREGAMENTO DE ESTADOS E CIDADES ---

                // Função para carregar os estados da API
                async function carregarEstados() {
                    try {
                        const response = await fetch('/api/estados');
                        if (!response.ok) throw new Error('Erro ao buscar estados');
                        const estados = await response.json();
                        estadoSelect.innerHTML = '<option value="">Selecione...</option>';
                        estados.forEach(estado => {
                            const option = document.createElement('option');
                            option.value = estado.id;
                            option.textContent = `${estado.uf} - ${estado.nome}`;
                            estadoSelect.appendChild(option);
                        });
                    } catch (error) {
                        console.error(error);
                        estadoSelect.innerHTML = '<option value="">Erro ao carregar</option>';
                    }
                }

                // Função para carregar as cidades de um estado específico
                async function carregarCidades(estadoId) {
                    if (!estadoId) {
                        cidadeSelect.innerHTML = '<option value="">Selecione um estado</option>';
                        cidadeSelect.disabled = true;
                        return;
                    }
                    cidadeSelect.disabled = false;
                    cidadeSelect.innerHTML = '<option value="">Carregando...</option>';
                    try {
                        const response = await fetch(`/api/cidades?estadoId=${estadoId}`);
                        if (!response.ok) throw new Error('Erro ao buscar cidades');
                        const cidades = await response.json();
                        cidadeSelect.innerHTML = '<option value="">Selecione...</option>';
                        cidades.forEach(cidade => {
                            const option = document.createElement('option');
                            option.value = cidade.id;
                            option.textContent = cidade.nome;
                            cidadeSelect.appendChild(option);
                        });
                    } catch (error) {
                        console.error(error);
                        cidadeSelect.innerHTML = '<option value="">Erro ao carregar</option>';
                    }
                }

                // Adiciona um evento que dispara quando o usuário muda o estado selecionado
                estadoSelect.addEventListener('change', () => {
                    carregarCidades(estadoSelect.value);
                });

                // --- 2. SUBMISSÃO DO FORMULÁRIO ---

                // Função para validar CPF (algoritmo padrão)
                function validarCPF(cpf) {
                    cpf = cpf.replace(/[^\d]+/g, '');
                    if (cpf == '') return false;
                    // Elimina CPFs invalidos conhecidos
                    if (cpf.length != 11 ||
                        cpf == "00000000000" ||
                        cpf == "11111111111" ||
                        cpf == "22222222222" ||
                        cpf == "33333333333" ||
                        cpf == "44444444444" ||
                        cpf == "55555555555" ||
                        cpf == "66666666666" ||
                        cpf == "77777777777" ||
                        cpf == "88888888888" ||
                        cpf == "99999999999")
                        return false;
                    // Valida 1o digito
                    let add = 0;
                    for (let i = 0; i < 9; i++)
                        add += parseInt(cpf.charAt(i)) * (10 - i);
                    let rev = 11 - (add % 11);
                    if (rev == 10 || rev == 11)
                        rev = 0;
                    if (rev != parseInt(cpf.charAt(9)))
                        return false;
                    // Valida 2o digito
                    add = 0;
                    for (let i = 0; i < 10; i++)
                        add += parseInt(cpf.charAt(i)) * (11 - i);
                    rev = 11 - (add % 11);
                    if (rev == 10 || rev == 11)
                        rev = 0;
                    if (rev != parseInt(cpf.charAt(10)))
                        return false;
                    return true;
                }

                // Adiciona um evento que dispara quando o formulário é enviado
                cadastroForm.addEventListener('submit', async (event) => {
                    event.preventDefault(); // Impede o envio padrão do formulário (que recarregaria a página)
                    errorMessageDiv.style.display = 'none'; // Esconde mensagens de erro antigas

                    const cpf = cpfInput.value;

                    if (!validarCPF(cpf)) {
                        errorMessageDiv.textContent = 'CPF inválido. Por favor, verifique o número digitado.';
                        errorMessageDiv.style.display = 'block';
                        return; // Impede o envio do formulário
                    }

                    // Coleta os dados dos campos do formulário
                    const formData = new FormData(cadastroForm);
                    const data = {
                        nome: formData.get('nome'),
                        email: formData.get('email'),
                        telefone: formData.get('telefone'),
                        genero: formData.get('genero'),
                        usuario: formData.get('usuario'),
                        senha: formData.get('senha'),
                        dataNascimento: formData.get('dataNascimento') || null,
                        cpf: formData.get('cpf').replace(/\D/g, ''), // Envia apenas os números
                        cidade: {
                            id: formData.get('cidade')
                        }
                    };

                    try {
                        // Envia os dados para a API de criação de pessoas usando o método POST
                        const response = await fetch('/api/pessoas', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(data) // Converte o objeto JavaScript para uma string JSON
                        });

                        // Se a resposta for um sucesso (status 201 Created), redireciona para a página de login
                        if (response.ok) {
                            alert('Cadastro realizado com sucesso! Você será redirecionado para a página de login.');
                            window.location.href = '/login';
                        } else {
                            // Se a resposta for um erro (ex: 400 Bad Request por usuário duplicado),
                            // pega a mensagem de erro do corpo da resposta e a exibe.
                            const errorText = await response.text();
                            errorMessageDiv.textContent = errorText;
                            errorMessageDiv.style.display = 'block';
                        }
                    } catch (error) {
                        // Se houver um erro de rede, exibe uma mensagem genérica.
                        console.error('Erro de rede:', error);
                        errorMessageDiv.textContent = 'Ocorreu um erro ao tentar se cadastrar. Tente novamente.';
                        errorMessageDiv.style.display = 'block';
                    }
                });

                // Carrega os estados assim que a página é carregada
                carregarEstados();
            } // Fim do if (cadastroForm)
        });
    </script>
</body>
</html>
