<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Exercícios - RMStudio Fitness</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header" th:replace="~{index :: header}"></header>

  <main class="main-content form-page-container">
    <div class="container">
      <h1 class="page-title"><i class="fas fa-running"></i> Gestão de Exercícios</h1>

      <div class="card form-card">
        <h3 class="card-title">Adicionar / Editar Exercício</h3>
        <form id="form-exercicio">
          <input type="hidden" id="id" name="id">
          <div class="form-group">
            <label for="nome" class="form-label">Nome do Exercício</label>
            <input type="text" id="nome" name="nome" class="form-control" required placeholder="Ex: Supino Reto">
          </div>
          <div class="form-group">
            <label for="grupoMuscular" class="form-label">Grupo Muscular</label>
            <select id="grupoMuscular" name="grupoMuscular" class="form-control" required>
              <option value="">Selecione…</option>
              <option value="PEITO">Peito</option>
              <option value="COSTAS">Costas</option>
              <option value="OMBRO">Ombros</option>
              <option value="BICEPS">Bíceps</option>
              <option value="TRICEPS">Tríceps</option>
              <option value="PERNA">Pernas</option>
              <option value="GLUTEO">Glúteos</option>
              <option value="ABDOMEN">Abdômen</option>
              <option value="CARDIO">Cardio</option>
            </select>
          </div>
          <div class="form-group">
            <label for="descricao" class="form-label">Descrição</label>
            <textarea id="descricao" name="descricao" class="form-control" rows="3" placeholder="Instruções sobre o exercício..."></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-plus"></i> Novo</button>
          </div>
        </form>
      </div>

      <div class="card" style="margin-top: 32px;">
        <h3 class="card-title">Exercícios Cadastrados</h3>
        <div class="table-responsive">
          <table class="table" id="tabela-exercicios">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Grupo Muscular</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="pagination-controls" id="pagination-controls"></div>
      </div>
    </div>
  </main>

  <footer class="footer" th:replace="~{index :: footer}"></footer>

    <script>
        const API_URL = '/api/exercicios';
        let form, tableBody, paginationControls;
        
        // Funções globais para serem acessíveis via onclick
        async function fetchData(page = 0, size = 10) {
      try {
        const response = await fetch(`${API_URL}?page=${page}&size=${size}&sort=nome,asc`);
        if (!response.ok) throw new Error('Erro ao buscar exercícios');
        const pageData = await response.json();
        renderTable(pageData.content);
        renderPagination(pageData);
          } catch (error) {
            console.error('Falha na requisição:', error);
            tableBody.innerHTML = `<tr><td colspan="3">Erro ao carregar dados.</td></tr>`;
          }
        }

        function renderTable(data) {
          tableBody.innerHTML = '';
           if (data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Nenhum exercício cadastrado.</td></tr>`;
            return;
          }
          data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${item.nome}</td>
              <td>${item.grupoMuscular}</td>
              <td class="cell-actions">
                <button class="btn btn-secondary" onclick="editItem('${item.id}')"><i class="fas fa-edit"></i></button>
                <button class="btn btn-secondary" onclick="deleteItem('${item.id}')"><i class="fas fa-trash"></i></button>
              </td>
            `;
            tableBody.appendChild(tr);
          });
        }

        function renderPagination(pageData) {
            paginationControls.innerHTML = '';
            if (pageData.totalPages <= 1) return;

            let html = '';
            if (!pageData.first) {
                html += `<button class="btn btn-secondary" onclick="fetchData(${pageData.number - 1})">Anterior</button>`;
            }
            for (let i = 0; i < pageData.totalPages; i++) {
                html += `<button class="btn ${i === pageData.number ? 'btn-primary active' : 'btn-secondary'}" onclick="fetchData(${i})">${i + 1}</button>`;
            }
            if (!pageData.last) {
                html += `<button class="btn btn-secondary" onclick="fetchData(${pageData.number + 1})">Próximo</button>`;
            }
            paginationControls.innerHTML = html;
        }

        async function handleSubmit(event) {
      event.preventDefault();
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      const id = data.id;

      const method = id ? 'PUT' : 'POST';
      const url = id ? `${API_URL}/${id}` : API_URL;

      try {
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        if (!response.ok) throw new Error('Erro ao salvar');
        resetForm();
        fetchData();
      } catch (error) {
        console.error('Falha ao salvar:', error);
      }
    }

        async function editItem(id) {
          try {
            const response = await fetch(`${API_URL}/${id}`);
            if (!response.ok) throw new Error('Exercício não encontrado');
            const item = await response.json();
            document.getElementById('id').value = item.id;
            document.getElementById('nome').value = item.nome;
            document.getElementById('descricao').value = item.descricao;
            document.getElementById('grupoMuscular').value = item.grupoMuscular;
            window.scrollTo(0, 0);
          } catch (error) {
            console.error('Falha ao carregar para edição:', error);
          }
        }

        async function deleteItem(id) {
          if (!confirm('Tem certeza que deseja excluir este exercício?')) return;
          try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (!response.ok) throw new Error('Erro ao excluir');
            fetchData();
          } catch (error) {
            console.error('Falha ao excluir:', error);
          }
        }

        function resetForm() {
          form.reset();
          document.getElementById('id').value = '';
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            form = document.getElementById('form-exercicio');
            tableBody = document.querySelector('#tabela-exercicios tbody');
            paginationControls = document.getElementById('pagination-controls');

            // Mobile nav toggle
            const navToggle = document.querySelector('.nav-toggle');
            const navLinks = document.querySelector('.nav-links');
            if (navToggle) {
                navToggle.addEventListener('click', () => {
                    navLinks.classList.toggle('open');
                });
            }
            
            form.addEventListener('submit', handleSubmit);
            
            // Carregar dados ao inicializar
            fetchData();
        });
  </script>
</body>
</html>
