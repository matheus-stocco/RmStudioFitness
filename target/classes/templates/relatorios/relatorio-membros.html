<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Membros - RM Studio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="plan-body">

    <header class="header" th:replace="~{index :: header}"></header>

    <main class="main-content form-page-container">
        <div class="container-fluid">
            <h1 class="page-title"><i class="fas fa-users"></i> Relatório de Membros Cadastrados</h1>

            <!-- Cards de Resumo -->
            <div class="summary-cards">
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-users"></i></div>
                    <div class="card-content">
                        <span class="card-title">Total de Membros</span>
                        <span class="card-value" th-text="${totalMembros}"></span>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-venus-mars"></i></div>
                    <div class="card-content">
                        <span class="card-title">Gênero</span>
                        <span class="card-value-small" th:text="'M: ' + ${totalMasculino} + ' | F: ' + ${totalFeminino} + ' | O: ' + ${totalOutro}"></span>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-user-check"></i></div>
                    <div class="card-content">
                        <span class="card-title">Ativos</span>
                        <span class="card-value" th:text="${totalAtivos}"></span>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-user-clock"></i></div>
                    <div class="card-content">
                        <span class="card-title">Ociosos</span>
                        <span class="card-value" th:text="${totalOciosos}"></span>
                    </div>
                </div>
            </div>

            <div class="card form-card card--wide">
                <div class="report-filters" style="justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 24px;">
                    <!-- Filtros de Status -->
                    <div class="status-filters" style="display: flex; gap: 12px;">
                        <a th:href="@{/relatorios/membros(status='TODOS')}"
                           th:classappend="${filtroStatus == 'TODOS'} ? 'btn-primary' : 'btn-secondary'"
                           class="btn">Todos</a>
                        <a th:href="@{/relatorios/membros(status='ATIVO')}"
                           th:classappend="${filtroStatus == 'ATIVO'} ? 'btn-primary' : 'btn-secondary'"
                           class="btn">Ativos</a>
                        <a th:href="@{/relatorios/membros(status='OCIOSO')}"
                           th:classappend="${filtroStatus == 'OCIOSO'} ? 'btn-primary' : 'btn-secondary'"
                           class="btn">Ociosos</a>
                    </div>

                    <!-- Formulário de Pesquisa -->
                    <form th:action="@{/relatorios/membros}" method="get" class="search-form" style="max-width: 400px;">
                        <input type="hidden" name="status" th:value="${filtroStatus}" />
                        <input type="text" name="nome" placeholder="Pesquisar por nome..." class="form-control" th:value="${nomePesquisado}">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i></button>
                    </form>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>CPF</th>
                                <th>Telefone</th>
                                <th>Data de Cadastro</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Os dados dos membros serão inseridos aqui pelo Thymeleaf -->
                            <tr th:each="membro : ${membros.content}">
                                <td th:text="${membro.id}"></td>
                                <td th:text="${membro.nome}"></td>
                                <td th:text="${membro.email}"></td>
                                <td th:text="${membro.cpf}"></td>
                                <td th:text="${membro.telefone}"></td>
                                <td th:text="${#temporals.format(membro.dataCadastro, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <!-- Se o membro tem um plano ativo, status é 'ATIVO' -->
                                    <span th:if="${membro.planoAtivo != null}" class="status-badge status--pago">ATIVO</span>
                                    <!-- Se não tem, status é 'OCIOSO' -->
                                    <span th:unless="${membro.planoAtivo != null}" class="status-badge status--cancelado">OCIOSO</span>
                                </td>
                            </tr>
                            <tr th:if="${membros.empty}">
                                <td colspan="7" class="text-center">Nenhum membro encontrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Controles de Paginação -->
                <nav aria-label="Page navigation" th:if="${membros.totalPages > 1}">
                    <ul class="pagination">
                        <!-- Botão Anterior -->
                        <li class="page-item" th:classappend="${membros.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, page=${membros.number - 1}, size=${membros.size})}">Anterior</a>
                        </li>

                        <!-- Números de Página -->
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, membros.totalPages - 1)}" th:classappend="${i == membros.number} ? 'active'">
                            <a class="page-link" th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, page=${i}, size=${membros.size})}" th:text="${i + 1}"></a>
                        </li>

                        <!-- Botão Próximo -->
                        <li class="page-item" th:classappend="${membros.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/relatorios/membros(status=${filtroStatus}, nome=${nomePesquisado}, page=${membros.number + 1}, size=${membros.size})}">Próximo</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <footer class="footer" th:replace="~{index :: footer}"></footer>

</body>
</html>
