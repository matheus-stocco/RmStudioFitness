<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Itens do Plano - RMStudio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .week-planner {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 32px;
        }
        .day-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
        }
        .day-title {
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--color-primary);
            padding-bottom: 10px;
        }
        .exercise-list {
            list-style: none;
            padding: 0;
            min-height: 100px;
        }
        .exercise-list li {
            background-color: #333;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .exercise-list .delete-item {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    <header class="header" th:replace="~{index :: header}"></header>

    <main class="main-content form-page-container">
        <div class="container">
            <h1 class="page-title">
                <i class="fas fa-clipboard-list"></i> Gestão de Itens do Plano
                <span id="plano-descricao" style="color: var(--color-primary); display: block; font-size: 1rem; text-transform: none; letter-spacing: normal; margin-top: 8px;"
                      th:text="|Plano: ${planoAula.nome} - Aluno: ${planoAula.aluno.nome}|"></span>
            </h1>
             <a th:href="@{/planos-aula}" class="btn btn-secondary" style="margin-bottom: 16px;"><i class="fas fa-arrow-left"></i> Voltar para Planos</a>

            <div class="card form-card">
                <h3 class="card-title">Adicionar Exercício ao Plano</h3>
                <form id="form-item-plano" th:action="@{/api/planos-aula/{planoId}/itens(planoId=${planoAula.id})}" method="post">
                    <input type="hidden" id="itemId" name="itemId">
                    <div class="form-group">
                        <label for="diaSemana" class="form-label">Dia da Semana</label>
                        <select id="diaSemana" name="dia" class="form-control" required>
                            <option th:each="dia : ${diasDaSemana}" th:value="${dia}" th:text="${dia.label}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="grupoMuscular" class="form-label">Grupo Muscular</label>
                        <select id="grupoMuscular" name="grupoMuscular" class="form-control">
                            <option value="">Todos</option>
                            <option th:each="grupo : ${gruposMusculares}" th:value="${grupo}" th:text="${grupo}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="exercicioId" class="form-label">Exercício</label>
                        <select id="exercicioId" name="exercicioId" class="form-control" required>
                            <option value="">Selecione um exercício</option>
                            <option th:each="ex : ${exercicios}" th:value="${ex.id}" th:text="${ex.nome}" th:attr="data-grupo=${ex.grupoMuscular}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="series" class="form-label">Séries</label>
                        <input type="number" id="series" name="series" class="form-control" required min="1">
                    </div>
                    <div class="form-group">
                        <label for="repeticoes" class="form-label">Repetições</label>
                        <input type="text" id="repeticoes" name="repeticoes" class="form-control" required placeholder="Ex: 8-12">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Adicionar Item</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-times"></i> Cancelar</button>
                    </div>
                </form>
            </div>

            <div class="week-planner" id="week-planner-container">
                <div th:each="dia : ${diasDaSemana}" class="day-card">
                    <h3 class="day-title" th:text="${dia.label}"></h3>
                    <ul class="exercise-list" th:id="|list-${dia.name()}|">
                         <li th:each="item : ${planoAula.getItensPorDia(dia)}" th:id="|item-${item.id}|">
                            <span>
                                <strong th:text="${item.exercicio.nome}"></strong>
                                (<span th:text="${item.series}"></span>x<span th:text="${item.repeticoes}"></span>)
                            </span>
                            <form th:action="@{/api/planos-aula/{planoId}/itens/{itemId}(planoId=${planoAula.id}, itemId=${item.id})}" method="post" style="display: inline;">
                                <input type="hidden" name="_method" value="delete"/>
                                <button type="submit" class="delete-item"><i class="fas fa-trash"></i></button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer" style="margin-top: auto;">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 RMStudio Fitness. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grupoMuscularSelect = document.getElementById('grupoMuscular');
            const exercicioSelect = document.getElementById('exercicioId');
            const exerciciosOptions = Array.from(exercicioSelect.options);

            grupoMuscularSelect.addEventListener('change', () => {
                const grupoSelecionado = grupoMuscularSelect.value;
                
                // Limpa o select de exercícios (mantendo a primeira opção)
                exercicioSelect.innerHTML = '';
                exercicioSelect.appendChild(exerciciosOptions[0]);

                // Filtra e adiciona as opções de exercícios
                exerciciosOptions.slice(1).forEach(option => {
                    if (!grupoSelecionado || option.getAttribute('data-grupo') === grupoSelecionado) {
                        exercicioSelect.appendChild(option.cloneNode(true));
                    }
                });
            });

            // Lógica do menu mobile
            const navToggle = document.querySelector('.nav-toggle');
            const navLinks = document.querySelector('.nav-links');
            if (navToggle) {
                navToggle.addEventListener('click', () => {
                    navLinks.classList.toggle('open');
                });
            }
        });

        function resetForm() {
            document.getElementById('form-item-plano').reset();
            document.getElementById('grupoMuscular').dispatchEvent(new Event('change'));
        }
    </script>
</body>
</html>
