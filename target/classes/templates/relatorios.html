<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - RMStudio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos dos badges de status */
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #fff;
            display: inline-block;
        }
        .status-pendente { background-color: #f0ad4e; }
        .status-pago { background-color: #5cb85c; }
        .status-atrasado { background-color: #d9534f; }
        .status-cancelado { background-color: #6c757d; }
    </style>
</head>
<body class="plan-body">
    
    <header class="header" th:replace="~{index :: header}"></header>

    <main class="main-content form-page-container">
        <div class="container-fluid">
            <h1 class="page-title"><i class="fas fa-chart-line"></i> Relatório de Mensalidades</h1>

            <!-- Cards de Resumo -->
            <div class="summary-cards">
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-dollar-sign"></i></div>
                    <div class="card-content">
                        <span class="card-title">Arrecadado no Mês</span>
                        <span class="card-value" th:text="'R$ ' + ${#numbers.formatDecimal(totalArrecadado, 1, 'POINT', 2, 'COMMA')}"></span>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                    <div class="card-content">
                        <span class="card-title">Previsão (Pendentes no Mês)</span>
                        <span class="card-value" th:text="'R$ ' + ${#numbers.formatDecimal(previsaoArrecadacao, 1, 'POINT', 2, 'COMMA')}"></span>
                    </div>
                </div>
            </div>

            <div class="card form-card card--wide">
                <!-- Filtros -->
                <div class="report-filters">
                    <a th:href="@{/relatorios(status='TODAS')}" class="btn" th:classappend="${filtroAtual == 'TODAS'} ? 'btn-primary' : 'btn-secondary'">Todas</a>
                    <a th:href="@{/relatorios(status='PAGO')}" class="btn" th:classappend="${filtroAtual == 'PAGO'} ? 'btn-primary' : 'btn-secondary'">Pagas</a>
                    <a th:href="@{/relatorios(status='PENDENTE')}" class="btn" th:classappend="${filtroAtual == 'PENDENTE'} ? 'btn-primary' : 'btn-secondary'">Pendentes</a>
                    <a th:href="@{/relatorios(status='ATRASADA')}" class="btn" th:classappend="${filtroAtual == 'ATRASADA'} ? 'btn-primary' : 'btn-secondary'">Atrasadas</a>
                    <a th:href="@{/relatorios(status='CANCELADO')}" class="btn" th:classappend="${filtroAtual == 'CANCELADO'} ? 'btn-primary' : 'btn-secondary'">Canceladas</a>
                </div>

                <!-- Tabela de Resultados -->
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Aluno</th>
                                <th>Plano</th>
                                <th>Valor</th>
                                <th>Vencimento</th>
                                <th>Data Pagamento</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${mensalidades}">
                                <td th:text="${m.pessoa.nome}"></td>
                                <td th:text="${m.tipoPlano.nome}"></td>
                                <td th:text="${'R$ ' + #numbers.formatDecimal(m.valor, 1, 'POINT', 2, 'COMMA')}"></td>
                                <td th:text="${#temporals.format(m.dataVencimento, 'dd/MM/yyyy')}"></td>
                                <td th:text="${m.dataPagamento != null ? #temporals.format(m.dataPagamento, 'dd/MM/yyyy') : '---'}"></td>
                                <td>
                                    <th:block th:switch="${m.status}">
                                        <span th:case="'PENDENTE'">
                                            <th:block th:if="${m.dataVencimento.isBefore(#temporals.createNow().toLocalDate())}">
                                                <span class="status-badge status-atrasado">ATRASADO</span>
                                            </th:block>
                                            <th:block th:unless="${m.dataVencimento.isBefore(#temporals.createNow().toLocalDate())}">
                                                <span class="status-badge status-pendente">PENDENTE</span>
                                            </th:block>
                                        </span>
                                        <span th:case="'PAGO'" class="status-badge status-pago">PAGO</span>
                                        <span th:case="'CANCELADO'" class="status-badge status-cancelado">CANCELADO</span>
                                        <span th:case="*" class="status-badge" th:text="${m.status}"></span> <!-- Default case -->
                                    </th:block>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(mensalidades)}">
                                <td colspan="6" class="text-center">Nenhuma mensalidade encontrada para este filtro.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" th:replace="~{index :: footer}"></footer>

</body>
</html>
