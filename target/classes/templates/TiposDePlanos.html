<!--
  Página de Planos.
  Esta página tem a função de exibir todos os planos disponíveis, buscando os dados dinamicamente da API.
  É muito semelhante à seção de planos da página inicial, mas em uma página dedicada.
-->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale-1.0">
  <title>Nossos Planos - RMStudio Fitness</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="plan-body">

  <!-- Reutiliza o fragmento "header" definido em index.html -->
  <header class="header" th:replace="~{index :: header}"></header>

  <main class="plan-main-content">
    <section id="planos" class="plan-section">
      <div class="plan-container">
        <h1 class="plan-title">ESCOLHA SEU PLANO</h1>
        
        <div class="plan-grid">
            <!-- Loop sobre os planos passados pelo controller -->
            <div th:each="plano, iterStat : ${planos}" 
                 th:classappend="${iterStat.index == 1} ? 'plan-card--highlighted' : ''" 
                 class="plan-card">
                
                <div th:if="${iterStat.index == 1}" class="best-choice-badge">
                    <span>Melhor Escolha</span>
                </div>
                
                <div class="plan-header">
                    <h3 class="plan-card-title" th:text="${plano.nome}"></h3>
                </div>

                <div class="plan-price">
                    <span class="price-currency">R$</span>
                    <span class="price-value" th:text="${#strings.substringBefore(plano.valor, '.')}"></span>
                    <span class="price-cents" th:text="',' + ${#strings.substringAfter(plano.valor, '.')}"></span>
                    <span class="price-period">/mês</span>
                </div>
                
                <ul class="plan-benefits">
                    <li th:each="item : ${plano.beneficios}">
                        <i class="fas fa-check"></i> <span th:text="${item}"></span>
                    </li>
                </ul>

                <!-- Botão para NÃO LOGADOS -->
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/autocastro}" class="plan-button">Matricule-se</a>
                </div>

                <!-- Botão para LOGADOS -->
                <div sec:authorize="isAuthenticated()">
                    <form th:action="@{/planos/inscrever/{planoId}(planoId=${plano.id})}" method="post" class="form-contratar-plano"
                          th:attr="data-confirm-troca='Tem certeza que deseja trocar seu plano? As cobranças pendentes do plano atual serão canceladas. Uma nova cobrança será gerada.', 
                                   data-confirm-novo='Tem certeza que deseja contratar este plano? Uma nova cobrança será gerada.', 
                                   data-plano-ativo=${planoAtivo != null}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="plan-button">Matricule-se</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</main>

<footer class="footer" th:replace="~{index :: footer}"></footer>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const forms = document.querySelectorAll('.form-contratar-plano');
    forms.forEach(form => {
        form.addEventListener('submit', (event) => {
            const planoAtivo = form.getAttribute('data-plano-ativo') === 'true';
            const msgTroca = form.getAttribute('data-confirm-troca');
            const msgNovo = form.getAttribute('data-confirm-novo');
            
            const mensagem = planoAtivo ? msgTroca : msgNovo;
            
            if (!confirm(mensagem)) {
                event.preventDefault(); // Cancela o envio do formulário se o usuário clicar em "Cancelar"
            }
        });
    });
});
</script>
</body>
</html>
