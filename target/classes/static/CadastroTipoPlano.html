<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Tipos de Plano - RMStudio Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a class="brand" href="/index.html"><i class="fas fa-dumbbell"></i> <span>RM</span>Studio</a>
                <button class="nav-toggle" aria-label="Abrir menu"><i class="fas fa-bars"></i></button>
                <div class="nav-links">
                    <a href="/index.html">Home</a>
                    <a href="/CadastroPessoas.html">Membros</a>
                    <a href="/CadastroPlanoAula.html">Planos</a>
                    <a href="/CadastroExercicios.html">Exercícios</a>
                    <div class="nav-item">
                        <a class="dropdown-toggle active">Cadastros <i class="fas fa-caret-down"></i></a>
                        <div class="dropdown-menu">
                          <a href="/CadastroAvaliacaoFisica.html">Avaliações</a>
                          <a href="/CadastroTipoPlano.html">Tipos de Plano</a>
                          <a href="/CadastroEstado.html">Estados</a>
                          <a href="/CadastroCidade.html">Cidades</a>
                        </div>
                    </div>
                    <a href="/login.html">Login</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="form-page-container">
        <div class="container">
            <h1 class="page-title"><i class="fas fa-tags"></i> Gestão de Tipos de Plano</h1>

            <div class="card form-card">
                <h3 class="card-title">Adicionar / Editar Tipo de Plano</h3>
                <form id="form-tipo-plano">
                    <input type="hidden" id="id" name="id">
                    <div class="form-group">
                        <label for="nome" class="form-label">Nome do Plano</label>
                        <input type="text" id="nome" name="nome" class="form-control" required placeholder="Ex: Plano Mensal">
                    </div>
                    <div class="form-group">
                        <label for="valor" class="form-label">Valor (R$)</label>
                        <input type="number" id="valor" name="valor" step="0.01" class="form-control" required placeholder="Ex: 99.90">
                    </div>
                    <div class="form-group">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea id="descricao" name="descricao" class="form-control" rows="3" placeholder="Detalhes do plano..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-plus"></i> Novo</button>
                    </div>
                </form>
            </div>

            <div class="card" style="margin-top: 32px;">
                <h3 class="card-title">Tipos de Plano Cadastrados</h3>
                <div class="table-responsive">
                    <table class="table" id="tabela-tipos-plano">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Valor (R$)</th>
                                <th>Descrição</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 RMStudio Fitness. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script>
        const API_URL = '/api/tipoplanos';
        const form = document.getElementById('form-tipo-plano');
        const tableBody = document.querySelector('#tabela-tipos-plano tbody');

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderTable(data);
            } catch (error) {
                console.error('Falha ao buscar dados:', error);
                tableBody.innerHTML = `<tr><td colspan="4">Erro ao carregar dados.</td></tr>`;
            }
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
             if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Nenhum tipo de plano cadastrado.</td></tr>`;
                return;
            }
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.nome}</td>
                    <td>${item.valor.toFixed(2)}</td>
                    <td>${item.descricao || ''}</td>
                    <td class="cell-actions">
                        <button class="btn btn-secondary" onclick="editItem('${item.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-secondary" onclick="deleteItem('${item.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            const id = data.id;

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                if (!response.ok) throw new Error('Erro ao salvar');
                resetForm();
                fetchData();
            } catch (error) {
                console.error('Falha ao salvar:', error);
            }
        });

        async function editItem(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const item = await response.json();
                document.getElementById('id').value = item.id;
                document.getElementById('nome').value = item.nome;
                document.getElementById('descricao').value = item.descricao;
                document.getElementById('valor').value = item.valor;
                window.scrollTo(0, 0);
            } catch (error) {
                console.error('Falha ao carregar para edição:', error);
            }
        }

        async function deleteItem(id) {
            if (!confirm('Tem certeza que deseja excluir este tipo de plano?')) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Erro ao excluir');
                fetchData();
            } catch (error) {
                console.error('Falha ao excluir:', error);
            }
        }

        function resetForm() {
            form.reset();
            document.getElementById('id').value = '';
        }

        document.addEventListener('DOMContentLoaded', fetchData);
        
        // Mobile nav toggle
        const navToggle = document.querySelector('.nav-toggle');
        const navLinks = document.querySelector('.nav-links');
        if (navToggle) {
            navToggle.addEventListener('click', () => {
                navLinks.classList.toggle('open');
            });
        }
    </script>
</body>
</html>
